<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" font-family="Segoe UI, system-ui, Arial, sans-serif">
<rect width="880" height="430" rx="14" fill="#fff" stroke="#e5e7eb"/>
<text x="440" y="36" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Quadtree — density-based recursive split (PostGIS)</text>
<text x="440" y="60" font-size="13" fill="#6b7280" text-anchor="middle">split a cell into 4 once it holds more than K drivers (K = 5 here) · a leaf cell IS the answer list for its area</text>
<rect x="24" y="86" width="416" height="300" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="40" y="108" font-size="12.5" font-weight="700" fill="#0f172a">The map — drivers = blue dots</text>
<rect x="40" y="120" width="190" height="248" rx="4" fill="#fef2f2" stroke="#f87171"/>
<text x="52" y="138" font-size="10" font-weight="700" fill="#991b1b">NE · 3 dots &lt; K=5 → leaf</text>
<circle cx="74" cy="176" r="5" fill="#3b82f6"/><circle cx="108" cy="154" r="5" fill="#3b82f6"/><circle cx="160" cy="202" r="5" fill="#3b82f6"/>
<rect x="230" y="120" width="196" height="248" rx="4" fill="#fff7ed" stroke="#fb923c"/>
<text x="242" y="138" font-size="10" font-weight="700" fill="#c2410c">NW · 7 dots ≥ K → split again</text>
<circle cx="252" cy="164" r="5" fill="#3b82f6"/><circle cx="284" cy="152" r="5" fill="#3b82f6"/><circle cx="316" cy="186" r="5" fill="#3b82f6"/><circle cx="262" cy="214" r="5" fill="#3b82f6"/><circle cx="300" cy="248" r="5" fill="#3b82f6"/><circle cx="350" cy="210" r="5" fill="#3b82f6"/><circle cx="396" cy="330" r="5" fill="#3b82f6"/>
<rect x="238" y="150" width="92" height="96" rx="3" fill="#fff" stroke="#fca5a5"/>
<text x="246" y="166" font-size="8.5" fill="#991b1b">2 → leaf</text>
<circle cx="262" cy="200" r="4" fill="#3b82f6"/><circle cx="284" cy="230" r="4" fill="#3b82f6"/>
<rect x="336" y="150" width="84" height="96" rx="3" fill="#fff" stroke="#fca5a5"/>
<text x="344" y="166" font-size="8.5" fill="#991b1b">2 → leaf</text>
<circle cx="350" cy="196" r="4" fill="#3b82f6"/><circle cx="396" cy="238" r="4" fill="#3b82f6"/>
<rect x="238" y="252" width="92" height="96" rx="3" fill="#fff" stroke="#fca5a5"/>
<text x="246" y="268" font-size="8.5" fill="#991b1b">1 → leaf</text>
<circle cx="300" cy="330" r="4" fill="#3b82f6"/>
<rect x="336" y="252" width="84" height="96" rx="3" fill="#fff" stroke="#fca5a5"/>
<text x="344" y="268" font-size="8.5" fill="#991b1b">2 → leaf</text>
<circle cx="316" cy="352" r="4" fill="#3b82f6"/><circle cx="364" cy="330" r="4" fill="#3b82f6"/>
<rect x="464" y="86" width="392" height="300" rx="12" fill="#fffbeb" stroke="#fde68a"/>
<text x="480" y="108" font-size="12.5" font-weight="700" fill="#92400e">The tree — same data, structured</text>
<line x1="604" y1="150" x2="520" y2="206" stroke="#64748b" stroke-width="2.5" marker-end="url(#a1)"/>
<line x1="604" y1="150" x2="690" y2="206" stroke="#64748b" stroke-width="2.5" marker-end="url(#a1)"/>
<line x1="604" y1="150" x2="560" y2="262" stroke="#64748b" stroke-width="2.5" marker-end="url(#a1)"/>
<line x1="604" y1="150" x2="690" y2="262" stroke="#64748b" stroke-width="2.5" marker-end="url(#a1)"/>
<circle cx="604" cy="132" r="16" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
<text x="604" y="137" font-size="10" font-weight="700" fill="#3730a3" text-anchor="middle">root</text>
<circle cx="520" cy="206" r="13" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
<text x="520" y="211" font-size="9" font-weight="700" fill="#991b1b" text-anchor="middle">NE</text>
<circle cx="690" cy="206" r="13" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
<text x="690" y="211" font-size="9" font-weight="700" fill="#c2410c" text-anchor="middle">NW</text>
<circle cx="560" cy="262" r="13" fill="#f0fdf4" stroke="#34d399" stroke-width="1.5"/>
<text x="560" y="267" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">SE</text>
<circle cx="690" cy="262" r="13" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="690" y="267" font-size="9" font-weight="700" fill="#3730a3" text-anchor="middle">SW</text>
<line x1="690" y1="219" x2="620" y2="306" stroke="#64748b" stroke-width="2" marker-end="url(#a1)"/>
<line x1="690" y1="219" x2="702" y2="306" stroke="#64748b" stroke-width="2" marker-end="url(#a1)"/>
<line x1="690" y1="219" x2="744" y2="306" stroke="#64748b" stroke-width="2" marker-end="url(#a1)"/>
<line x1="690" y1="219" x2="786" y2="306" stroke="#64748b" stroke-width="2" marker-end="url(#a1)"/>
<circle cx="620" cy="306" r="11" fill="#fff" stroke="#fca5a5"/><text x="620" y="310" font-size="8.5" fill="#991b1b" text-anchor="middle">00</text>
<circle cx="702" cy="306" r="11" fill="#fff" stroke="#fca5a5"/><text x="702" y="310" font-size="8.5" fill="#991b1b" text-anchor="middle">01</text>
<circle cx="744" cy="306" r="11" fill="#fff" stroke="#fca5a5"/><text x="744" y="310" font-size="8.5" fill="#991b1b" text-anchor="middle">02</text>
<circle cx="786" cy="306" r="11" fill="#fff" stroke="#fca5a5"/><text x="786" y="310" font-size="8.5" fill="#991b1b" text-anchor="middle">03</text>
<text x="470" y="352" font-size="10.5" font-weight="700" fill="#92400e">Query: walk root → leaf covering the rider.</text>
<text x="470" y="371" font-size="10.5" fill="#78350f">That leaf IS "drivers nearby" — cost = tree depth, not map size.</text>
<text x="470" y="396" font-size="10.5" font-weight="700" fill="#991b1b">Catch: every 5-s write may rebalance the tree (expensive in memory) →</text>
<text x="470" y="414" font-size="10.5" fill="#78350f">why Uber's high-frequency updates push us to geohash instead.</text>
<defs>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
</defs>
</svg>