<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="900" height="480" rx="16" fill="#ffffff"/>
  <rect width="900" height="480" rx="16" fill="none" stroke="#e5e7eb" stroke-width="2"/>
  <text x="450" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Setback to recovery — the layoff is the trigger, the recovery is the story</text>
  <text x="450" y="54" text-anchor="middle" font-size="13" fill="#6b7280">The interviewer should remember: setback → reaction → accept → plan → act → adapt → persist → learn</text>

  <rect x="20" y="82" width="195" height="118" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <rect x="20" y="82" width="195" height="30" rx="12" fill="#ef4444"/>
  <text x="117" y="101" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">1 · SETBACK</text>
  <text x="117" y="136" text-anchor="middle" font-size="12.5" fill="#7f1d1d">Layoff — big career</text>
  <text x="117" y="158" text-anchor="middle" font-size="12.5" fill="#7f1d1d">investment + outside</text>
  <text x="117" y="180" text-anchor="middle" font-size="12.5" fill="#7f1d1d">responsibilities</text>

  <rect x="235" y="82" width="195" height="118" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <rect x="235" y="82" width="195" height="30" rx="12" fill="#f59e0b"/>
  <text x="332" y="101" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">2 · INITIAL REACTION</text>
  <text x="332" y="136" text-anchor="middle" font-size="12.5" fill="#713f12">Disappointment +</text>
  <text x="332" y="158" text-anchor="middle" font-size="12.5" fill="#713f12">uncertainty — gave</text>
  <text x="332" y="180" text-anchor="middle" font-size="12.5" fill="#713f12">myself time to process</text>

  <rect x="450" y="82" width="195" height="118" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <rect x="450" y="82" width="195" height="30" rx="12" fill="#f59e0b"/>
  <text x="547" y="101" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">3 · ACCEPT REALITY</text>
  <text x="547" y="136" text-anchor="middle" font-size="12.5" fill="#713f12">Dwelling won’t change</text>
  <text x="547" y="158" text-anchor="middle" font-size="12.5" fill="#713f12">anything → focus on</text>
  <text x="547" y="180" text-anchor="middle" font-size="12.5" fill="#713f12">what I can control</text>

  <rect x="665" y="82" width="215" height="118" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <rect x="665" y="82" width="215" height="30" rx="12" fill="#6366f1"/>
  <text x="772" y="101" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">4 · CREATE A PLAN</text>
  <text x="772" y="136" text-anchor="middle" font-size="12.5" fill="#1e293b">Structured routine:</text>
  <text x="772" y="158" text-anchor="middle" font-size="12.5" fill="#1e293b">applications + DSA,</text>
  <text x="772" y="180" text-anchor="middle" font-size="12.5" fill="#1e293b">system design, backend</text>

  <line x1="215" y1="141" x2="235" y2="141" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="141" x2="450" y2="141" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="645" y1="141" x2="665" y2="141" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 762 200 L 762 225 L 117 225 L 117 250" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="20" y="250" width="195" height="118" rx="12" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <rect x="20" y="250" width="195" height="30" rx="12" fill="#22c55e"/>
  <text x="117" y="269" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">5 · CONSISTENT ACTION</text>
  <text x="117" y="304" text-anchor="middle" font-size="12.5" fill="#065f46">Applied regularly</text>
  <text x="117" y="326" text-anchor="middle" font-size="12.5" fill="#065f46">even with no callbacks</text>
  <text x="117" y="348" text-anchor="middle" font-size="12.5" fill="#065f46">— tracked everything</text>

  <rect x="235" y="250" width="195" height="118" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
  <rect x="235" y="250" width="195" height="30" rx="12" fill="#14b8a6"/>
  <text x="332" y="269" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">6 · ADAPT</text>
  <text x="332" y="304" text-anchor="middle" font-size="12.5" fill="#0f766e">Found the funnel leak:</text>
  <text x="332" y="326" text-anchor="middle" font-size="12.5" fill="#0f766e">resume → DSA → system</text>
  <text x="332" y="348" text-anchor="middle" font-size="12.5" fill="#0f766e">design → behavioral</text>

  <rect x="450" y="250" width="195" height="118" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
  <rect x="450" y="250" width="195" height="30" rx="12" fill="#0ea5e9"/>
  <text x="547" y="269" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">7 · KEEP GOING</text>
  <text x="547" y="304" text-anchor="middle" font-size="12.5" fill="#075985">Silence is data, not</text>
  <text x="547" y="326" text-anchor="middle" font-size="12.5" fill="#075985">a verdict — kept</text>
  <text x="547" y="348" text-anchor="middle" font-size="12.5" fill="#075985">executing the plan</text>

  <rect x="665" y="250" width="215" height="118" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="665" y="250" width="215" height="30" rx="12" fill="#8b5cf6"/>
  <text x="772" y="269" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">8 · OUTCOME &amp; LEARNING</text>
  <text x="772" y="304" text-anchor="middle" font-size="12.5" fill="#4c1d95">Resilience = execute</text>
  <text x="772" y="326" text-anchor="middle" font-size="12.5" fill="#4c1d95">when results are</text>
  <text x="772" y="348" text-anchor="middle" font-size="12.5" fill="#4c1d95">discouraging · remain</text>

  <line x1="215" y1="309" x2="235" y2="309" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="309" x2="450" y2="309" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="645" y1="309" x2="665" y2="309" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="8" y="396" width="884" height="68" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="24" y="420" fill="#111827" font-weight="700">Airtime (60–90 s):  setback + reaction + acceptance ~20 s  ·  plan + action + adapt ~35 s  ·  learning + bridge ~15 s</text>
  <text x="24" y="442" fill="#6b7280">The interviewer should remember ONE thing: you built a process, ran it, and kept running it while the results were quiet.</text>
</svg>