<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="900" height="570" rx="16" fill="#ffffff"/>
  <rect width="900" height="570" rx="16" fill="none" stroke="#e5e7eb" stroke-width="2"/>
  <text x="450" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Root cause — why SMS died and WhatsApp kept working</text>
  <text x="450" y="54" text-anchor="middle" font-size="13" fill="#6b7280">DLT: the telecom registry every SMS must pass (mandated by TRAI in India) — WhatsApp bypasses it entirely</text>

  <text x="160" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">SMS PATH — THE FAILURE</text>
  <rect x="16" y="82" width="288" height="54" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="160" y="113" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3730a3">APP / OTP SERVICE</text>
  <rect x="16" y="146" width="288" height="54" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="160" y="177" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3730a3">SMS GATEWAY (PROVIDER)</text>
  <rect x="16" y="210" width="288" height="54" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="160" y="241" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400e">TELECOM OPERATOR</text>
  <rect x="16" y="274" width="288" height="68" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="160" y="303" text-anchor="middle" font-size="13.5" font-weight="700" fill="#991b1b">DLT REGISTRY CHECK</text>
  <text x="160" y="325" text-anchor="middle" font-size="12" fill="#991b1b">header + template must be approved</text>
  <rect x="16" y="366" width="288" height="56" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="160" y="392" text-anchor="middle" font-size="13.5" font-weight="700" fill="#991b1b">❌ OTP never delivered</text>
  <text x="160" y="410" text-anchor="middle" font-size="12" fill="#991b1b">user stuck on the login screen</text>
  <line x1="160" y1="136" x2="160" y2="146" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="160" y1="200" x2="160" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="160" y1="264" x2="160" y2="274" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="160" y1="342" x2="160" y2="366" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="680" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">WHATSAPP PATH — STILL WORKING</text>
  <rect x="460" y="82" width="440" height="54" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="680" y="113" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3730a3">APP / OTP SERVICE</text>
  <rect x="460" y="146" width="440" height="54" rx="10" fill="#ecfdf5" stroke="#22c55e"/>
  <text x="680" y="177" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f46">WHATSAPP PROVIDER (OTT)</text>
  <rect x="460" y="210" width="440" height="54" rx="10" fill="#ecfdf5" stroke="#22c55e"/>
  <text x="680" y="241" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f46">NO DLT CHECK — message passes</text>
  <rect x="460" y="274" width="440" height="68" rx="10" fill="#ecfdf5" stroke="#22c55e"/>
  <text x="680" y="303" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f46">SEPARATE OTT PIPELINE</text>
  <text x="680" y="325" text-anchor="middle" font-size="12" fill="#065f46">unaffected by SMS / DLT blocks</text>
  <rect x="460" y="366" width="440" height="56" rx="10" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <text x="680" y="392" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f46">✓ OTP delivered — login works</text>
  <text x="680" y="410" text-anchor="middle" font-size="12" fill="#065f46">this is why the “WhatsApp works” test mattered</text>
  <line x1="680" y1="136" x2="680" y2="146" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="200" x2="680" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="264" x2="680" y2="274" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="342" x2="680" y2="366" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="16" y="448" width="424" height="100" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="32" y="472" font-size="13.5" font-weight="700" fill="#92400e">Why it took ~30 min to find</text>
  <text x="32" y="493" font-size="12.5" fill="#78350f">Our logs said “sent” but never stored the provider’s</text>
  <text x="32" y="511" font-size="12.5" fill="#78350f">response, so a total block looked like normal traffic.</text>
  <text x="32" y="529" font-size="12.5" fill="#78350f">Detection needs delivery status, not just send status.</text>

  <rect x="460" y="448" width="424" height="100" rx="10" fill="#fef2f2" stroke="#ef4444"/>
  <text x="476" y="472" font-size="13.5" font-weight="700" fill="#991b1b">Why we couldn’t just wait</text>
  <text x="476" y="493" font-size="12.5" fill="#7f1d1d">A fresh DLT registration takes ~4 days, so waiting</text>
  <text x="476" y="511" font-size="12.5" fill="#7f1d1d">was not an option. Containment had to reroute</text>
  <text x="476" y="529" font-size="12.5" fill="#7f1d1d">around the provider rather than retry it.</text>
</svg>