<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" font-family="Segoe UI, system-ui, Arial, sans-serif">
<defs><marker id="arr1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
<rect width="880" height="320" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
<text x="440" y="36" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Tumbling vs sliding windows — the key functional decision</text>
<text x="440" y="60" font-size="13" fill="#6b7280" text-anchor="middle">assume tumbling first (simple + precise). Sliding = always moving, always recomputing.</text>
<rect x="24" y="80" width="410" height="216" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="44" y="108" font-size="14" font-weight="700" fill="#15803d">Tumbling (what we assume)</text>
<text x="44" y="128" font-size="12" fill="#374151">fixed boundaries: Hr0 | Hr1 | Hr2 ... week = 7 days, month = 28 days</text>
<g font-size="12" font-weight="700" text-anchor="middle">
<rect x="44" y="142" width="90" height="52" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="89" y="164" fill="#15803d">Hr0</text><text x="89" y="182" fill="#15803d" font-weight="400">t0-t1</text>
<rect x="142" y="142" width="90" height="52" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="187" y="164" fill="#15803d">Hr1</text><text x="187" y="182" fill="#15803d" font-weight="400">t1-t2</text>
<rect x="240" y="142" width="90" height="52" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="285" y="164" fill="#15803d">Hr2</text><text x="285" y="182" fill="#15803d" font-weight="400">t2-t3</text>
<rect x="338" y="142" width="76" height="52" rx="8" fill="#ffffff" stroke="#22c55e" stroke-dasharray="5 4"/><text x="376" y="164" fill="#15803d">Hr3</text><text x="376" y="182" fill="#15803d" font-weight="400">...</text>
</g>
<text x="44" y="222" font-size="12" fill="#15803d">✓ no overlap ✓ cacheable (one key per window) ✓ cheap cron</text>
<text x="44" y="242" font-size="12" fill="#15803d">✓ precise results easy — just SUM views in [windowStart, windowEnd]</text>
<text x="44" y="264" font-size="12" fill="#374151">ex: “last month” = fixed 28-day block, not “last 28×24h from now”</text>
<text x="44" y="284" font-size="12" fill="#374151">video: “last week = Sunday-to-Sunday of prior week”</text>

<rect x="446" y="80" width="410" height="216" rx="12" fill="#fef2f2" stroke="#fecaca"/>
<text x="466" y="108" font-size="14" font-weight="700" fill="#b91c1c">Sliding (deferred to deep dive)</text>
<text x="466" y="128" font-size="12" fill="#374151">window moves with “now”: last 60 min / last 7×24h from this second</text>
<g>
<rect x="466" y="142" width="370" height="22" rx="6" fill="#e5e7eb"/>
<rect x="486" y="142" width="180" height="22" rx="6" fill="#fca5a5" stroke="#b91c1c"/><text x="576" y="157" font-size="11" fill="#7f1d1d" text-anchor="middle">window at T=60</text>
<rect x="546" y="168" width="180" height="22" rx="6" fill="#fecaca" stroke="#b91c1c" stroke-dasharray="4 3"/><text x="636" y="183" font-size="11" fill="#7f1d1d" text-anchor="middle">window at T=61 (shifted +1)</text>
</g>
<text x="466" y="216" font-size="12" fill="#b91c1c">✗ overlaps ✗ new window every second/minute ✗ cache never hits</text>
<text x="466" y="236" font-size="12" fill="#374151">update rule: + new views − views that “fell out” of window</text>
<text x="466" y="256" font-size="12" fill="#374151">needs Flink sliding windows / minute tables (see deep dive 3)</text>
<text x="466" y="276" font-size="12" fill="#374151">video: 1-hour sliding = change between T60→T61 is +6 −5 = +1</text>

</svg>
