<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="100%" font-family="Segoe UI, system-ui, Arial, sans-serif">
<rect width="880" height="560" rx="14" fill="#fff" stroke="#e5e7eb"/>
<text x="440" y="36" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Deep dive 1b — routing between chat servers: present the ladder IN ORDER</text>
<text x="440" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Kafka ✗ (too heavy) → consistent hashing ~ (correct, orchestration-heavy) → Redis Pub/Sub ✓ (thin fast-lane)</text>
<rect x="24" y="84" width="270" height="344" rx="12" fill="#fef2f2" stroke="#fecaca"/>
<text x="44" y="108" font-size="13" font-weight="700" fill="#991b1b">A — Kafka per-user topics</text>
<text x="44" y="132" font-size="10.5" fill="#374151">subscribe to "my topic" on connect;</text>
<text x="44" y="148" font-size="10.5" fill="#374151">senders write to the recipient's topic</text>
<text x="44" y="176" font-size="11" font-weight="700" fill="#991b1b">✗ not a fit — three reasons</text>
<text x="44" y="198" font-size="10.5" fill="#374151">· ~50–100 KB overhead PER topic →</text>
<text x="44" y="214" font-size="10.5" fill="#374151">  billions of topics = TBs of metadata</text>
<text x="44" y="234" font-size="10.5" fill="#374151">· not built for short-lived micro-topics</text>
<text x="44" y="254" font-size="10.5" fill="#374151">· chat servers subscribe/unsubscribe</text>
<text x="44" y="270" font-size="10.5" fill="#374151">  constantly (churn WhatsApp-style)</text>
<text x="44" y="306" font-size="10.5" fill="#6b7280">a VERY common first instinct — the interviewer expects you to shoot it down yourself</text>
<rect x="314" y="84" width="270" height="344" rx="12" fill="#fff7ed" stroke="#fdba74"/>
<text x="334" y="108" font-size="13" font-weight="700" fill="#c2410c">B — Consistent hashing ring</text>
<text x="334" y="132" font-size="10.5" fill="#374151">predictable ring: user → OWNED server</text>
<text x="334" y="148" font-size="10.5" fill="#374151">chat registry + Zookeeper/etcd config</text>
<text x="334" y="176" font-size="11" font-weight="700" fill="#c2410c">✓ right idea · cost is orchestration</text>
<text x="334" y="198" font-size="10.5" fill="#374151">· "which server owns B" is computable →</text>
<text x="334" y="214" font-size="10.5" fill="#374151">  direct server-to-server hop (2 total)</text>
<text x="334" y="234" font-size="10.5" fill="#374151">✗ scaling = migration: 4→5 servers moves</text>
<text x="334" y="250" font-size="10.5" fill="#374151">  ~20% of users (disconnect → re-register</text>
<text x="334" y="266" font-size="10.5" fill="#374151">  → reconnect), slowly, with double-sends</text>
<text x="334" y="286" font-size="10.5" fill="#374151">✗ hot servers possible (uneven load)</text>
<text x="334" y="318" font-size="10.5" fill="#6b7280">a correct, senior-flavoured answer — the video lands here, then upgrades</text>
<rect x="604" y="84" width="252" height="344" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="624" y="108" font-size="13" font-weight="700" fill="#15803d">C — Redis Pub/Sub — winner</text>
<text x="624" y="132" font-size="10.5" fill="#374151">chat server SUBSCRIBES to the topics of</text>
<text x="624" y="148" font-size="10.5" fill="#374151">the users it serves; publish → redis hash</text>
<text x="624" y="164" font-size="10.5" fill="#374151">map → owning server → websocket</text>
<text x="624" y="192" font-size="11" font-weight="700" fill="#15803d">✓ why it's safe</text>
<text x="624" y="214" font-size="10.5" fill="#374151">at-most-once is FINE: messages + inbox</text>
<text x="624" y="230" font-size="10.5" fill="#374151">(durable store) are the source of truth;</text>
<text x="624" y="246" font-size="10.5" fill="#374151">pub/sub is only the &lt;500 ms fast lane</text>
<text x="624" y="266" font-size="11" font-weight="700" fill="#15803d">✓ trade-offs, said out loud</text>
<text x="624" y="288" font-size="10.5" fill="#374151">tiny cluster suffices (dumb socket broker);</text>
<text x="624" y="304" font-size="10.5" fill="#374151">✗ n×m server↔node connections; the same</text>
<text x="624" y="320" font-size="10.5" fill="#374151">migration pain if the redis cluster itself grows</text>
<rect x="24" y="452" width="832" height="90" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="40" y="476" font-size="13" font-weight="700" fill="#15803d">Say this sentence (it's the whole deep dive):</text>
<text x="40" y="500" font-size="12" fill="#374151">"We keep the realtime path THIN and lean on the durable store. Redis Pub/Sub delivers the message in milliseconds;</text>
<text x="40" y="520" font-size="12" fill="#374151">the messages + inbox tables guarantee it will eventually arrive even if pub/sub drops every single notification."</text>
</svg>