<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="900" height="400" rx="16" fill="#ffffff"/>
  <rect width="900" height="400" rx="16" fill="none" stroke="#e5e7eb" stroke-width="2"/>
  <text x="450" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">One answer — the 4-phase incident response model</text>
  <text x="450" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Name the phases and the interviewer hears “senior incident owner”, not “we fixed a bug”</text>

  <rect x="16" y="80" width="194" height="172" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <rect x="16" y="80" width="194" height="32" rx="12" fill="#6366f1"/>
  <text x="113" y="100" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">1 · PREPARATION</text>
  <text x="113" y="134" text-anchor="middle" font-size="12.5" fill="#1e293b">Know the policy —</text>
  <text x="113" y="156" text-anchor="middle" font-size="12.5" fill="#1e293b">OTP login via SMS or</text>
  <text x="113" y="178" text-anchor="middle" font-size="12.5" fill="#1e293b">WhatsApp; max 3</text>
  <text x="113" y="200" text-anchor="middle" font-size="12.5" fill="#1e293b">retries. That is the</text>
  <text x="113" y="222" text-anchor="middle" font-size="12.5" fill="#1e293b">baseline of “working”</text>

  <rect x="240" y="80" width="194" height="172" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <rect x="240" y="80" width="194" height="32" rx="12" fill="#f59e0b"/>
  <text x="337" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2 · DETECTION &amp; ANALYSIS</text>
  <text x="337" y="134" text-anchor="middle" font-size="12.5" fill="#1e293b">P1 raised → P0 later.</text>
  <text x="337" y="156" text-anchor="middle" font-size="12.5" fill="#1e293b">No deploys, nothing</text>
  <text x="337" y="178" text-anchor="middle" font-size="12.5" fill="#1e293b">changed → look outside</text>
  <text x="337" y="200" text-anchor="middle" font-size="12.5" fill="#1e293b">our code. Data query +</text>
  <text x="337" y="222" text-anchor="middle" font-size="12.5" fill="#1e293b">provider portal → DLT</text>

  <rect x="464" y="80" width="194" height="172" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <rect x="464" y="80" width="194" height="32" rx="12" fill="#ef4444"/>
  <text x="561" y="100" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">3 · CONTAINMENT</text>
  <text x="561" y="134" text-anchor="middle" font-size="12.5" fill="#1e293b">WhatsApp healthy →</text>
  <text x="561" y="156" text-anchor="middle" font-size="12.5" fill="#1e293b">route OTP via config</text>
  <text x="561" y="178" text-anchor="middle" font-size="12.5" fill="#1e293b">behind a feature flag →</text>
  <text x="561" y="200" text-anchor="middle" font-size="12.5" fill="#1e293b">all apps log in again,</text>
  <text x="561" y="222" text-anchor="middle" font-size="12.5" fill="#1e293b">success back to baseline</text>

  <rect x="688" y="80" width="196" height="172" rx="12" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <rect x="688" y="80" width="196" height="32" rx="12" fill="#22c55e"/>
  <text x="786" y="100" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">4 · POST-INCIDENT</text>
  <text x="786" y="134" text-anchor="middle" font-size="12.5" fill="#065f46">Re-apply DLT, make</text>
  <text x="786" y="156" text-anchor="middle" font-size="12.5" fill="#065f46">comms configurable,</text>
  <text x="786" y="178" text-anchor="middle" font-size="12.5" fill="#065f46">feature flags, fallbacks,</text>
  <text x="786" y="200" text-anchor="middle" font-size="12.5" fill="#065f46">no hardcoded config,</text>
  <text x="786" y="222" text-anchor="middle" font-size="12.5" fill="#065f46">postmortem shared</text>

  <line x1="210" y1="166" x2="240" y2="166" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="434" y1="166" x2="464" y2="166" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="658" y1="166" x2="688" y2="166" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="8" y="270" width="884" height="112" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="24" y="294" fill="#111827" font-weight="700">Time budget (60–90 s):   Prep 10 s   ·   Detection &amp; Analysis 25 s   ·   Containment &amp; Recovery 25 s   ·   Post-incident + lesson 30 s</text>
  <text x="24" y="316" fill="#6b7280">What the interviewer grades:  1) you stay calm  2) you show method  3) you change the system — not “we fixed a bug”</text>
  <rect x="24" y="330" width="848" height="38" rx="8" fill="#ecfdf5" stroke="#22c55e"/>
  <text x="40" y="349" fill="#065f46" font-weight="700">Golden rule: one sentence of impact · three of method · two of system change</text>
  <text x="40" y="363" fill="#065f46">Never blame the provider or your team — the system that depended on the provider was yours.</text>
</svg>