<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="100%" font-family="Segoe UI, system-ui, Arial, sans-serif">
<rect width="880" height="330" rx="14" fill="#fff" stroke="#e5e7eb"/>
<text x="440" y="36" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Deep dive: read-heavy + HA — CDN first, Redis second</text>
<text x="440" y="60" font-size="13" fill="#6b7280" text-anchor="middle">100M DAU mostly BROWSE · event pages rarely change → cache aggressively, and staleness here is fine</text>
<rect x="24" y="84" width="90" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="69" y="114" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Client</text>
<rect x="160" y="80" width="110" height="60" rx="30" fill="#eef2ff" stroke="#818cf8" stroke-width="2.5"/>
<text x="215" y="105" font-size="12" font-weight="700" fill="#3730a3" text-anchor="middle">CDN</text>
<text x="215" y="124" font-size="9.5" fill="#6b7280" text-anchor="middle">edge cache</text>
<rect x="316" y="80" width="150" height="60" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="391" y="102" font-size="12" font-weight="700" fill="#3730a3" text-anchor="middle">API Gateway</text>
<text x="391" y="122" font-size="10" fill="#374151" text-anchor="middle">authn · rate-limit · route</text>
<line x1="114" y1="110" x2="160" y2="110" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<line x1="270" y1="110" x2="316" y2="110" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<rect x="512" y="140" width="140" height="64" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="582" y="163" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">Event CRUD</text>
<text x="582" y="182" font-size="10" fill="#374151" text-anchor="middle">GET /event/{id}</text>
<rect x="512" y="228" width="140" height="52" rx="26" fill="#fff" stroke="#ef4444" stroke-width="2.5"/>
<text x="582" y="250" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Redis</text>
<text x="582" y="268" font-size="9.5" fill="#6b7280" text-anchor="middle">cache-aside, TTL</text>
<rect x="700" y="228" width="150" height="64" rx="28" fill="#fff" stroke="#0ea5e9" stroke-width="2.5"/>
<text x="775" y="252" font-size="12" font-weight="700" fill="#0369a1" text-anchor="middle">Postgres</text>
<text x="775" y="270" font-size="10" fill="#6b7280" text-anchor="middle">source of truth</text>
<line x1="391" y1="140" x2="512" y2="165" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<line x1="582" y1="204" x2="582" y2="228" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<line x1="652" y1="256" x2="700" y2="256" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a2)"/>
<text x="658" y="246" font-size="10" fill="#6b7280">miss →</text>
<rect x="24" y="228" width="140" height="120" rx="10" fill="#fffbeb" stroke="#fde68a"/>
<text x="94" y="250" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">Two layers, two jobs</text>
<text x="38" y="272" font-size="10.5" fill="#78350f">CDN: full event pages,</text>
<text x="38" y="289" font-size="10.5" fill="#78350f">seat-map assets, images</text>
<text x="38" y="312" font-size="10.5" fill="#78350f">Redis: hot event JSON</text>
<text x="38" y="329" font-size="10.5" fill="#78350f">close to the service</text>
<rect x="700" y="84" width="156" height="120" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="778" y="106" font-size="11.5" font-weight="700" fill="#15803d" text-anchor="middle">Why this is safe</text>
<text x="716" y="128" font-size="10.5" fill="#374151">event name, venue,</text>
<text x="716" y="145" font-size="10.5" fill="#374151">performer, description</text>
<text x="716" y="162" font-size="10.5" fill="#374151">change ~never</text>
<text x="716" y="186" font-size="10.5" fill="#15803d" font-weight="700">NFR3 HA ✓ NFR4 read-heavy ✓</text>
<defs>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs>
</svg>
