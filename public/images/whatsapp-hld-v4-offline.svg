<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="100%" font-family="Segoe UI, system-ui, Arial, sans-serif">
<rect width="880" height="560" rx="14" fill="#fff" stroke="#e5e7eb"/>
<text x="440" y="36" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">HLD v4 — satisfying FR4: read messages after going offline</text>
<text x="440" y="60" font-size="13" fill="#6b7280" text-anchor="middle">the one-node drawing grows a messages table + an inbox row per recipient. delivery becomes eventual AND durable</text>
<rect x="24" y="84" width="420" height="120" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="44" y="108" font-size="12.5" font-weight="700" fill="#15803d">WRITE (online delivery path)</text>
<text x="44" y="130" font-size="11" fill="#374151">1 · A → send_message(chatId, contents)</text>
<text x="44" y="148" font-size="11" fill="#374151">2 · participants ← chat_participant (PK)</text>
<text x="44" y="166" font-size="11" fill="#374151">3 · TRANSACTION: messages { 1 row } +</text>
<text x="44" y="184" font-size="11" fill="#374151">   inbox { 1 row per member }</text>
<text x="44" y="200" font-size="11" fill="#374151">4 · push to online members → 5 · they ACK</text>
<rect x="458" y="84" width="398" height="120" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="478" y="108" font-size="12.5" font-weight="700" fill="#3730a3">RECONNECT (offline catch-up path)</text>
<text x="478" y="130" font-size="11" fill="#374151">1 · client connects → server lists inbox rows</text>
<text x="478" y="148" font-size="11" fill="#374151">   for that recipientId (undelivered only)</text>
<text x="478" y="166" font-size="11" fill="#374151">2 · fetch each message's contents</text>
<text x="478" y="184" font-size="11" fill="#374151">3 · deliver over the new websocket</text>
<text x="478" y="200" font-size="11" fill="#374151">4 · client ACKs → rows are deleted</text>
<rect x="24" y="226" width="110" height="54" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="79" y="250" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">User A app</text>
<text x="79" y="268" font-size="9" fill="#6b7280" text-anchor="middle">sends / acks</text>
<line x1="134" y1="252" x2="162" y2="252" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<text x="130" y="242" font-size="9" fill="#374151">send_message</text>
<rect x="162" y="216" width="210" height="88" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="267" y="238" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle">Chat server</text>
<text x="267" y="258" font-size="10" fill="#374151" text-anchor="middle">1 node · hashmap of sockets</text>
<text x="267" y="276" font-size="10" fill="#374151">writes atomically + pushes</text>
<text x="267" y="294" font-size="10" fill="#374151">+ deletes inbox row on ACK</text>
<line x1="372" y1="260" x2="400" y2="260" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<rect x="400" y="216" width="200" height="96" rx="26" fill="#fff" stroke="#0ea5e9" stroke-width="2.5"/>
<text x="500" y="238" font-size="11.5" font-weight="700" fill="#0369a1" text-anchor="middle">DynamoDB</text>
<text x="500" y="258" font-size="9.5" fill="#6b7280" text-anchor="middle">messages — id · contents ·</text>
<text x="500" y="274" font-size="9.5" fill="#6b7280" text-anchor="middle">senderId · timestamp (server)</text>
<text x="500" y="294" font-size="9.5" fill="#6b7280" text-anchor="middle">inbox — recipientId · messageId</text>
<line x1="372" y1="280" x2="630" y2="200" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a2)"/>
<rect x="630" y="170" width="126" height="56" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="693" y="196" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">User B app</text>
<text x="693" y="214" font-size="9" fill="#6b7280" text-anchor="middle">(C and D likewise)</text>
<line x1="372" y1="250" x2="690" y2="330" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a2)"/>
<text x="470" y="336" font-size="9" fill="#6b7280">reconnect → drain inbox → ack each → row gone</text>
<rect x="540" y="330" width="280" height="46" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="680" y="352" font-size="10.5" font-weight="700" fill="#3730a3" text-anchor="middle">guarantee: eventual delivery to every device</text>
<text x="680" y="368" font-size="10" fill="#6b7280" text-anchor="middle">as long as it connects periodically</text>
<rect x="24" y="390" width="404" height="146" rx="10" fill="#fef2f2" stroke="#fecaca"/>
<text x="44" y="414" font-size="12.5" font-weight="700" fill="#991b1b">Why the inbox row per recipient?</text>
<text x="44" y="436" font-size="10.5" fill="#374151">ACKs must be per CLIENT, not per chat — "B got it,</text>
<text x="44" y="454" font-size="10.5" fill="#374151">C didn't" is the state, and a row per recipient IS</text>
<text x="44" y="472" font-size="10.5" fill="#374151">that state. Delete-on-ack = retry-on-reconnect policy</text>
<text x="44" y="490" font-size="10.5" fill="#374151">for free.</text>
<text x="44" y="516" font-size="10" fill="#991b1b" font-weight="700">DynamoDB transactions cap at 100 records</text>
<text x="44" y="532" font-size="10" fill="#6b7280">→ that is WHY group chats cap at ~100 members (99 + message row).</text>
<rect x="452" y="390" width="404" height="146" rx="10" fill="#fffbeb" stroke="#fde68a"/>
<text x="472" y="414" font-size="12.5" font-weight="700" fill="#92400e">Checkpoint — all four FRs are DONE</text>
<text x="472" y="436" font-size="10.5" fill="#374151">· FR1 chats ✓ · FR2 messages ✓ (online)</text>
<text x="472" y="454" font-size="10.5" fill="#374151">· FR3 media ✓ (offloaded) · FR4 offline ✓ (inbox)</text>
<text x="472" y="472" font-size="10.5" fill="#374151">even NFR1 (500 ms push) + NFR2 (durable) hold —</text>
<text x="472" y="490" font-size="10.5" fill="#374151">for a SINGLE chat server. NFR3 (billions) does not.</text>
<text x="472" y="516" font-size="10" font-weight="700" fill="#92400e">State this out loud: "this design is degenerate,</text>
<text x="472" y="532" font-size="10" fill="#6b7280">and I know exactly where it breaks → deep dives."</text>
<defs>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs>
</svg>