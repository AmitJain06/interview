<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="100%" font-family="Segoe UI, system-ui, Arial, sans-serif">
<rect width="880" height="360" rx="14" fill="#fff" stroke="#e5e7eb"/>
<text x="440" y="36" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Deep dive: booking — strong consistency via a Redis ticket lock</text>
<text x="440" y="60" font-size="13" fill="#6b7280" text-anchor="middle">NFR2: one ticket, one owner, never sold twice · the lock TTL = the hold window</text>
<rect x="24" y="84" width="176" height="40" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="112" y="109" font-size="12" font-weight="700" fill="#3730a3" text-anchor="middle">POST /reserve</text>
<rect x="224" y="84" width="216" height="66" rx="8" fill="#fff" stroke="#fca5a5"/>
<text x="332" y="106" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">SET ticketlock:{ticketId} = userId</text>
<text x="332" y="124" font-size="11" fill="#374151" text-anchor="middle">NX · EX 600</text>
<text x="332" y="141" font-size="10" fill="#6b7280" text-anchor="middle">atomic — first writer wins, loser gets 409</text>
<rect x="24" y="150" width="176" height="40" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="112" y="175" font-size="12" font-weight="700" fill="#3730a3" text-anchor="middle">PUT /confirm</text>
<rect x="224" y="150" width="216" height="66" rx="8" fill="#fff" stroke="#fca5a5"/>
<text x="332" y="172" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">verify lock owner = caller</text>
<text x="332" y="190" font-size="11" fill="#374151" text-anchor="middle">UPDATE status → booked</text>
<text x="332" y="207" font-size="10" fill="#6b7280" text-anchor="middle">charge Stripe, then release lock</text>
<rect x="464" y="84" width="180" height="132" rx="12" fill="#fef2f2" stroke="#fecaca"/>
<text x="554" y="110" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">Failure modes — free wins</text>
<text x="480" y="134" font-size="11" fill="#374151">· user quits → TTL expires,</text>
<text x="480" y="152" font-size="11" fill="#374151">  ticket back in the pool</text>
<text x="480" y="170" font-size="11" fill="#374151">· Stripe dies → hold survives,</text>
<text x="480" y="188" font-size="11" fill="#374151">  retry within TTL</text>
<text x="480" y="206" font-size="10" fill="#6b7280">no janitor cron needed</text>
<rect x="668" y="84" width="188" height="132" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="762" y="110" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">Why not DB row locks?</text>
<text x="684" y="134" font-size="11" fill="#374151">100k fans → 100k held</text>
<text x="684" y="152" font-size="11" fill="#374151">connections on Postgres</text>
<text x="684" y="170" font-size="11" fill="#374151">Redis: O(1) keys, no DB</text>
<text x="684" y="188" font-size="11" fill="#374151">connections burned</text>
<text x="684" y="206" font-size="10" fill="#15803d">DB rows change only at confirm</text>
<rect x="24" y="228" width="832" height="108" rx="10" fill="#fffbeb" stroke="#fde68a"/>
<text x="40" y="252" font-size="13" font-weight="700" fill="#92400e">The interview hinge — split consistency BY PATH:</text>
<text x="40" y="274" font-size="12" fill="#78350f">reads (search, event view): HA over consistency — stale seconds are fine, cache everything.</text>
<text x="40" y="294" font-size="12" fill="#78350f">booking: STRONG consistency — the Redis lock serializes contenders per ticket; the final Postgres UPDATE is the single write that matters.</text>
<text x="40" y="314" font-size="12" fill="#78350f">Same family as Top-K's “cache the read path, protect the write path” — here the protected resource is a ticket.</text>
</svg>
