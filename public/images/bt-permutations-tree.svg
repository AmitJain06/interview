<g font-size="12" fill="#3730a3">
<text x="44" y="572" font-weight="700">Reading the tree:</text>
<text x="44" y="594">• Indigo path = the first depth-first journey: [] → [1] → [1,2] → [1,2,3] (saved) → UNDO → [1,3] → [1,3,2] (saved)</text>
<text x="44" y="614">• Green nodes = complete permutations (leaves) — all 3! = 6 are saved into `result`</text>
<text x="44" y="632">• Choices per level: 3 → 2 → 1 · each level fills ONE position · leaves = 3 × 2 × 1 = 6</text>
