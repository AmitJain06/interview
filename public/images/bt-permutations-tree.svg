<text x="440" y="34" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Recursion tree for nums = [1, 2, 3] — leaves = 3! = 6 permutations</text>
<text x="440" y="58" font-size="13" fill="#6b7280" text-anchor="middle">A node = the partial permutation so far · an edge = "choose the next UNUSED element"</text>

