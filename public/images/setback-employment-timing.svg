<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="900" height="450" rx="16" fill="#ffffff"/>
  <rect width="900" height="450" rx="16" fill="none" stroke="#e5e7eb" stroke-width="2"/>
  <text x="450" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Honesty at the finish line — match the ending to the truth</text>
  <text x="450" y="54" text-anchor="middle" font-size="13" fill="#6b7280">“Eventually I got another job” is only an option if it actually happened</text>

  <rect x="290" y="90" width="320" height="64" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">ARE YOU STILL IN THE PROCESS</text>
  <text x="450" y="138" text-anchor="middle" font-size="13" fill="#713f12">at the time of the interview?</text>

  <line x1="360" y1="154" x2="250" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="154" x2="650" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="20" y="212" width="420" height="116" rx="12" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <rect x="20" y="212" width="420" height="30" rx="12" fill="#22c55e"/>
  <text x="230" y="231" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">STILL IN THE PROCESS → SAY THIS</text>
  <text x="230" y="264" text-anchor="middle" font-size="12.5" fill="#065f46">“I’m still in the process — I’ve built a</text>
  <text x="230" y="286" text-anchor="middle" font-size="12.5" fill="#065f46">structured preparation and application</text>
  <text x="230" y="308" text-anchor="middle" font-size="12.5" fill="#065f46">plan and I’m continuing to execute it.”</text>

  <rect x="460" y="212" width="420" height="116" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="460" y="212" width="420" height="30" rx="12" fill="#8b5cf6"/>
  <text x="670" y="231" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">FOUND THE ROLE → SAY THIS</text>
  <text x="670" y="264" text-anchor="middle" font-size="12.5" fill="#4c1d95">“I found a role, and the process I built is</text>
  <text x="670" y="286" text-anchor="middle" font-size="12.5" fill="#4c1d95">exactly why it worked” — then spend the</text>
  <text x="670" y="308" text-anchor="middle" font-size="12.5" fill="#4c1d95">airtime on the lesson, not just the outcome.</text>

  <rect x="20" y="356" width="860" height="78" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="36" y="380" fill="#991b1b" font-weight="700">The one forbidden move: a false ending.</text>
  <text x="36" y="402" fill="#7f1d1d">If asked “are you currently employed?”, answer honestly — hiring teams verify, and the whole story collapses if the ending isn’t true.</text>
  <text x="36" y="420" fill="#065f46">A truthful in-progress answer reads as trust + resilience; a fake “I got a job” reads as the only real failure in the set.</text>
</svg>