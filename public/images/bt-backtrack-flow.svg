<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="100%" font-family="Segoe UI, system-ui, Arial, sans-serif">
<defs>
<marker id="bt-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/></marker>
</defs>
<rect width="880" height="350" rx="14" fill="#fff" stroke="#e5e7eb"/>

<text x="440" y="34" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Backtracking recipe — the heartbeat of every recursive search</text>
<text x="440" y="58" font-size="13" fill="#6b7280" text-anchor="middle">CHOOSE an element → EXPLORE deeper → UNDO it again · repeats for every candidate</text>

<g font-size="12" text-anchor="middle">
<rect x="40" y="88" width="220" height="140" rx="12" fill="#eef2ff" stroke="#6366f1"/>
<text x="150" y="112" font-size="15" font-weight="800" fill="#3730a3">1 · CHOOSE</text>
<text x="150" y="134" font-family="Consolas, monospace" fill="#4338ca">used[i] = true;</text>
<text x="150" y="154" font-family="Consolas, monospace" fill="#4338ca">current.Add(nums[i]);</text>
<text x="150" y="182" font-size="12" fill="#4f46e5">claim an element that</text>
<text x="150" y="200" font-size="12" fill="#4f46e5">is still UNUSED</text>

<rect x="330" y="88" width="220" height="140" rx="12" fill="#f0fdf4" stroke="#22c55e"/>
<text x="440" y="112" font-size="15" font-weight="800" fill="#15803d">2 · EXPLORE</text>
<text x="440" y="134" font-family="Consolas, monospace" fill="#166534">Backtrack(…);</text>
<text x="440" y="182" font-size="12" fill="#16a34a">recurse one level deeper</text>
<text x="440" y="200" font-size="12" fill="#16a34a">to fill the NEXT position</text>

<rect x="620" y="88" width="220" height="140" rx="12" fill="#fffbeb" stroke="#f59e0b"/>
<text x="730" y="112" font-size="15" font-weight="800" fill="#b45309">3 · UNDO</text>
<text x="730" y="134" font-family="Consolas, monospace" fill="#b45309">current.RemoveAt(…);</text>
<text x="730" y="154" font-family="Consolas, monospace" fill="#b45309">used[i] = false;</text>
<text x="730" y="182" font-size="12" fill="#b45309">restore the state to what</text>
<text x="730" y="200" font-size="12" fill="#b45309">it was BEFORE step 1</text>
</g>
<path d="M 260 158 H 326" stroke="#6366f1" stroke-width="2.5" marker-end="url(#bt-arr)"/>
<path d="M 550 158 H 616" stroke="#6366f1" stroke-width="2.5" marker-end="url(#bt-arr)"/>
<path d="M 730 228 V 268 H 150 V 232" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#bt-arr)"/>
<text x="440" y="285" font-size="12" font-weight="700" fill="#4f46e5" text-anchor="middle">loop: next candidate for the SAME position repeats 1 → 2 → 3</text>

<rect x="24" y="302" width="832" height="32" rx="8" fill="#fef2f2" stroke="#fecaca"/>
<text x="440" y="323" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">NO UNDO → current never shrinks and used never frees → you only ever build [1,2,3] and lose the other 5 permutations</text>
</svg>