<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" font-family="Segoe UI, system-ui, Arial, sans-serif">
<rect width="880" height="430" rx="14" fill="#fff" stroke="#e5e7eb"/>
<text x="440" y="36" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Geohash — fixed-precision, density-agnostic (Redis)</text>
<text x="440" y="60" font-size="13" fill="#6b7280" text-anchor="middle">split the world into 4s down to a chosen precision · no K, no rebalancing · the string IS the key</text>

<rect x="24" y="86" width="416" height="300" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="40" y="108" font-size="12.5" font-weight="700" fill="#0f172a">Recursive 4-way grid — zooming into cell "2"</text>
<rect x="40" y="120" width="388" height="120" rx="3" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="52" y="138" font-size="10" font-weight="700" fill="#3730a3">Layer 0 · whole world</text>
<path d="M 234 180 L 234 232 M 234 180 L 234 120" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0"/>
<text x="52" y="172" font-size="9" fill="#374151">split into 4 → each cell gets one digit:</text>
<text x="52" y="192" font-size="9.5" font-weight="700" fill="#3730a3">0  1  2  3</text>
<rect x="144" y="150" width="118" height="76" rx="3" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
<text x="156" y="168" font-size="10" font-weight="700" fill="#c2410c">cell "2"</text>
<text x="156" y="190" font-size="9" fill="#6b7280">we crank up precision</text>
<rect x="40" y="252" width="388" height="120" rx="3" fill="#fff7ed" stroke="#fb923c"/>
<text x="52" y="270" font-size="10" font-weight="700" fill="#c2410c">Layer 2 · cell "2" split again</text>
<rect x="96" y="278" width="140" height="84" rx="3" fill="#fff" stroke="#fca5a5"/>
<text x="108" y="296" font-size="9.5" font-weight="700" fill="#991b1b">"2" → "20"</text>
<rect x="248" y="278" width="166" height="84" rx="3" fill="#fff" stroke="#fca5a5"/>
<text x="260" y="296" font-size="9.5" font-weight="700" fill="#991b1b">"21" "22" "23"</text>
<text x="260" y="316" font-size="8.5" fill="#6b7280">(2 0 · 2 1 · 2 2 · 2 3)</text>
<text x="108" y="316" font-size="8.5" fill="#6b7280">(2 0 → 20 · 2 1 → 21 …)</text>

<rect x="464" y="86" width="392" height="300" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="480" y="108" font-size="12.5" font-weight="700" fill="#15803d">Why this wins for Uber</text>
<text x="480" y="134" font-size="11" fill="#374151">1 · the path is just a STRING — base-32 encoded</text>
<text x="480" y="154" font-size="11" fill="#374151">   (e.g. drj  = downtown-area prefix)</text>
<text x="480" y="178" font-size="11" fill="#374151">2 · longer string = smaller, more precise cell</text>
<text x="480" y="198" font-size="11" fill="#374151">3 · prefix = the REGION → "give me drivers</text>
<text x="480" y="214" font-size="11" fill="#374151">   whose key starts with drj" = radius query</text>
<text x="480" y="238" font-size="11" fill="#374151">4 · cheap to compute, trivial to store, NO</text>
<text x="480" y="254" font-size="11" fill="#374151">   extra index structure to maintain — so a</text>
<text x="480" y="270" font-size="11" fill="#374151">   write never triggers a rebalance</text>
<text x="480" y="294" font-size="11" font-weight="700" fill="#047857">→ Redis geohash absorbs our 600k writes/s</text>
<text x="480" y="312" font-size="10.5" fill="#6b7280">trade-off: precision is fixed — empty ocean</text>
<text x="480" y="328" font-size="10.5" fill="#6b7280">gets the same cell budget as busy Manhattan</text>
<text x="480" y="352" font-size="11" font-weight="700" fill="#15803d">queries: ZRANGEBYSCORE / GEO neighbors on the</text>
<text x="480" y="368" font-size="11" font-weight="700" fill="#15803d">prefix — no tree walk, no map-wide scan</text>
<defs>
</defs>
</svg>