<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" font-family="Segoe UI, system-ui, Arial, sans-serif">
<defs>
<marker id="u-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/></marker>
</defs>
<rect width="880" height="340" rx="14" fill="#fff" stroke="#e5e7eb"/>

<text x="440" y="30" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Why UNDO is non-negotiable — `current` and `used` are SHARED, not copied</text>
<text x="440" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Zoom into the first branch: [] → [1] → [1,2] → [1,2,3] saved → UNDO back to [1] → try [1,3]</text>

<g font-size="12" text-anchor="middle">
<rect x="24" y="76" width="196" height="118" rx="12" fill="#eef2ff" stroke="#6366f1"/>
<text x="122" y="98" font-size="13" font-weight="800" fill="#3730a3">① CHOOSE 1</text>
<text x="122" y="124" font-family="Consolas, monospace" fill="#4338ca">current = [1]</text>
<text x="122" y="142" font-family="Consolas, monospace" fill="#4338ca">used = [T,F,F]</text>
<text x="122" y="172" font-size="11" fill="#4f46e5">position 1 = 1</text>

<rect x="244" y="76" width="196" height="118" rx="12" fill="#eef2ff" stroke="#6366f1"/>
<text x="342" y="98" font-size="13" font-weight="800" fill="#3730a3">② CHOOSE 2</text>
<text x="342" y="124" font-family="Consolas, monospace" fill="#4338ca">current = [1,2]</text>
<text x="342" y="142" font-family="Consolas, monospace" fill="#4338ca">used = [T,T,F]</text>
<text x="342" y="172" font-size="11" fill="#4f46e5">position 2 = 2</text>

<rect x="464" y="76" width="196" height="118" rx="12" fill="#f0fdf4" stroke="#22c55e"/>
<text x="562" y="98" font-size="13" font-weight="800" fill="#15803d">③ EXPLORE → leaf</text>
<text x="562" y="124" font-family="Consolas, monospace" fill="#166534">current = [1,2,3]</text>
<text x="562" y="142" font-family="Consolas, monospace" fill="#166534">used = [T,T,T]</text>
<text x="562" y="172" font-size="11" fill="#16a34a">save copy → return</text>

<rect x="684" y="76" width="196" height="118" rx="12" fill="#fffbeb" stroke="#f59e0b"/>
<text x="782" y="98" font-size="13" font-weight="800" fill="#b45309">④ UNDO</text>
<text x="782" y="124" font-family="Consolas, monospace" fill="#b45309">current = [1]</text>
<text x="782" y="142" font-family="Consolas, monospace" fill="#b45309">used = [T,F,F]</text>
<text x="782" y="172" font-size="11" fill="#b45309">next i → try 3 → [1,3]</text>
</g>
<path d="M 220 135 H 240" stroke="#6366f1" stroke-width="2.5" marker-end="url(#u-arr)"/>
<path d="M 440 135 H 460" stroke="#6366f1" stroke-width="2.5" marker-end="url(#u-arr)"/>
<path d="M 660 135 H 680" stroke="#6366f1" stroke-width="2.5" marker-end="url(#u-arr)"/>

<rect x="24" y="210" width="832" height="112" rx="12" fill="#fef2f2" stroke="#fecaca"/>
<text x="44" y="234" font-size="14" font-weight="800" fill="#b91c1c">If we DELETE the UNDO step:</text>
<text x="44" y="258" font-size="12" fill="#7f1d1d">• After the leaf returns, `current` still holds [1,2,3] and `used` stays [T,T,T].</text>
<text x="44" y="278" font-size="12" fill="#7f1d1d">• The for-loop tries i=2 → appends 3 again → duplicates like [1,2,3,3]; “used” is always true →</text>
<text x="44" y="296" font-size="12" fill="#7f1d1d">  nothing can ever be chosen again → [1,3,…] branches are never explored → most answers are lost.</text>
<text x="44" y="316" font-size="12" font-weight="700" fill="#b91c1c">UNDO restores the exact state from before CHOOSE — that is the whole trick.</text>
</svg>