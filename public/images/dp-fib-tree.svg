<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Inter, Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="420" rx="16" fill="#ffffff"/>
  <rect x="0" y="0" width="900" height="420" rx="16" fill="none" stroke="#e5e7eb" stroke-width="2"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">fib(5) recursion tree — repeats circled</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Red = recomputed. DP computes each once and reuses.</text>
  <g stroke="#9ca3af" stroke-width="2" fill="none">
    <line x1="450" y1="96" x2="280" y2="150"/>
    <line x1="450" y1="96" x2="620" y2="150"/>
    <line x1="280" y1="150" x2="180" y2="210"/>
    <line x1="280" y1="150" x2="380" y2="210"/>
    <line x1="620" y1="150" x2="560" y2="210"/>
    <line x1="620" y1="150" x2="690" y2="210"/>
    <line x1="180" y1="210" x2="130" y2="270"/>
    <line x1="180" y1="210" x2="230" y2="270"/>
    <line x1="380" y1="210" x2="330" y2="270"/>
    <line x1="380" y1="210" x2="430" y2="270"/>
    <line x1="560" y1="210" x2="520" y2="270"/>
    <line x1="560" y1="210" x2="600" y2="270"/>
  </g>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="415" y="72" width="70" height="34" rx="17" fill="#111827"/><text x="450" y="94" fill="#fff">fib(5)</text>
    <rect x="245" y="128" width="70" height="34" rx="17" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="280" y="150" fill="#111827">fib(4)</text>
    <rect x="585" y="128" width="70" height="34" rx="17" fill="#fee2e2" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4"/><text x="620" y="150" fill="#111827">fib(3) ×2</text>
    <rect x="145" y="188" width="70" height="34" rx="17" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="180" y="210" fill="#111827">fib(3)</text>
    <rect x="345" y="188" width="70" height="34" rx="17" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/><text x="380" y="210" fill="#111827">fib(2) ×3</text>
    <rect x="525" y="188" width="70" height="34" rx="17" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="560" y="210" fill="#111827">fib(2)</text>
    <rect x="655" y="188" width="70" height="34" rx="17" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="690" y="210" fill="#111827">fib(1)</text>
    <g font-size="12">
      <rect x="100" y="252" width="60" height="30" rx="15" fill="#eef2ff" stroke="#6366f1"/><text x="130" y="271" fill="#111827">fib(2)</text>
      <rect x="170" y="252" width="60" height="30" rx="15" fill="#ecfdf5" stroke="#10b981"/><text x="200" y="271" fill="#111827">fib(1)</text>
      <rect x="300" y="252" width="60" height="30" rx="15" fill="#ecfdf5" stroke="#10b981"/><text x="330" y="271" fill="#111827">fib(1)</text>
      <rect x="370" y="252" width="60" height="30" rx="15" fill="#ecfdf5" stroke="#10b981"/><text x="400" y="271" fill="#111827">fib(0)</text>
      <rect x="490" y="252" width="60" height="30" rx="15" fill="#ecfdf5" stroke="#10b981"/><text x="520" y="271" fill="#111827">fib(1)</text>
      <rect x="560" y="252" width="60" height="30" rx="15" fill="#ecfdf5" stroke="#10b981"/><text x="590" y="271" fill="#111827">fib(0)</text>
    </g>
  </g>
  <g font-size="13">
    <rect x="60" y="310" width="780" height="78" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="80" y="334" fill="#111827" font-weight="700">Count: fib(3) = 2 calls, fib(2) = 3 calls, fib(1) = 3 calls.</text>
    <text x="80" y="355" fill="#374151">Naive total for fib(5) = 15 calls. Memoization = 6 unique states (0..5).</text>
    <text x="80" y="374" fill="#6b7280">Interview line: “I see the same node twice, so I memoize.”</text>
  </g>
</svg>
