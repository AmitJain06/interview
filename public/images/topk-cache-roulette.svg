<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="100%" font-family="Segoe UI, system-ui, Arial, sans-serif">
<defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
<rect width="880" height="330" rx="14" fill="#fff" stroke="#e5e7eb"/>
<text x="440" y="36" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Deep dive 1a — read-through cache alone = Russian roulette</text>
<text x="440" y="60" font-size="13" fill="#6b7280" text-anchor="middle">key = window:{truncated_timestamp} → value = Top-K response · TTL 30 days · single-digit ms on HIT</text>
<rect x="24" y="80" width="170" height="110" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="109" y="106" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">Client</text>
<text x="109" y="126" font-size="11" fill="#374151" text-anchor="middle">GET /views/top-k</text>
<text x="109" y="142" font-size="11" fill="#374151" text-anchor="middle">?window=7d&amp;k=50</text>
<text x="109" y="164" font-size="11" fill="#6b7280" text-anchor="middle">thousands of RPS</text>
<rect x="210" y="80" width="180" height="110" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="300" y="106" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">Top-K service</text>
<text x="300" y="126" font-size="11" fill="#374151" text-anchor="middle">1. check Redis</text>
<text x="300" y="142" font-size="11" fill="#374151" text-anchor="middle">2. miss → query DB</text>
<text x="300" y="158" font-size="11" fill="#374151" text-anchor="middle">3. backfill cache</text>
<rect x="406" y="80" width="190" height="110" rx="12" fill="#fef9c3" stroke="#fde047"/>
<text x="501" y="106" font-size="13" font-weight="700" fill="#854d0e" text-anchor="middle">Redis cache</text>
<rect x="420" y="118" width="162" height="52" rx="6" fill="#1e293b"/>
<text x="501" y="136" font-size="10" fill="#fde047" text-anchor="middle">“week:2026-W36”</text>
<text x="501" y="152" font-size="10" fill="#e2e8f0" text-anchor="middle">→ [vidX:9.2M, …]</text>
<rect x="612" y="80" width="244" height="110" rx="12" fill="#fef2f2" stroke="#fecaca"/>
<text x="734" y="106" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">Views DB (slow query)</text>
<text x="734" y="126" font-size="11" fill="#374151" text-anchor="middle">GROUP BY billions of rows</text>
<text x="734" y="142" font-size="11" fill="#374151" text-anchor="middle">sort + LIMIT k</text>
<text x="734" y="162" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">minutes → hours ✗ timeout</text>
<line x1="194" y1="135" x2="210" y2="135" stroke="#64748b" stroke-width="3" marker-end="url(#a2)"/>
<line x1="390" y1="125" x2="406" y2="125" stroke="#22c55e" stroke-width="3" marker-end="url(#a2)"/>
<line x1="390" y1="160" x2="612" y2="160" stroke="#ef4444" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#a2)"/>
<rect x="24" y="204" width="410" height="102" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="40" y="228" font-size="13" font-weight="700" fill="#15803d">HIT path (99%): amazing</text>
<text x="40" y="248" font-size="12" fill="#374151">single-digit ms · no DB load · happy users</text>
<text x="40" y="268" font-size="12" fill="#374151">average latency looks great on a dashboard…</text>
<text x="40" y="288" font-size="12" fill="#374151">…but averages hide the 1% disaster.</text>

<rect x="446" y="204" width="410" height="102" rx="10" fill="#fef2f2" stroke="#fecaca"/>
<text x="462" y="228" font-size="13" font-weight="700" fill="#b91c1c">MISS path (1%): catastrophic</text>
<text x="462" y="248" font-size="12" fill="#374151">every hour rolls over → new key → miss storm</text>
<text x="462" y="268" font-size="12" fill="#374151">thousands of RPS × minutes-long query = pile-up</text>
<text x="462" y="288" font-size="12" font-weight="700" fill="#b91c1c">unpredictable = unbuildable (“Russian roulette”)</text>

</svg>
