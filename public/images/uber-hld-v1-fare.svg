<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="100%" font-family="Segoe UI, system-ui, Arial, sans-serif">
<rect width="880" height="400" rx="14" fill="#fff" stroke="#e5e7eb"/>
<text x="440" y="36" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">HLD v1 — satisfying FR1: the fare estimate</text>
<text x="440" y="60" font-size="13" fill="#6b7280" text-anchor="middle">POST /ride/fare-estimate → gateway → ride service → 3rd-party maps → persist → return { rideId, fare, eta }</text>
<rect x="24" y="150" width="100" height="56" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="74" y="176" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Rider app</text>
<text x="74" y="192" font-size="9.5" fill="#6b7280" text-anchor="middle">(iOS / Android)</text>
<line x1="124" y1="178" x2="154" y2="178" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<rect x="154" y="130" width="150" height="96" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="229" y="152" font-size="12.5" font-weight="700" fill="#3730a3" text-anchor="middle">API Gateway</text>
<text x="229" y="172" font-size="10.5" fill="#374151" text-anchor="middle">· load balancing</text>
<text x="229" y="190" font-size="10.5" fill="#374151" text-anchor="middle">· routing → service</text>
<text x="229" y="208" font-size="10.5" fill="#374151" text-anchor="middle">· authn · TLS · rate limit</text>
<line x1="304" y1="178" x2="334" y2="178" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<rect x="334" y="140" width="140" height="80" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="404" y="162" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle">Ride service</text>
<text x="404" y="182" font-size="10.5" fill="#374151" text-anchor="middle">computes fare + ETA</text>
<text x="404" y="200" font-size="10" fill="#6b7280" text-anchor="middle">(ML model → simplify to</text>
<text x="404" y="214" font-size="10" fill="#6b7280" text-anchor="middle">fare ≈ ETA × rate)</text>
<line x1="444" y1="160" x2="474" y2="100" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<text x="430" y="92" font-size="10" fill="#374151">get ETA (traffic)</text>
<rect x="474" y="80" width="150" height="52" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="2.5"/>
<text x="549" y="102" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">3rd-party maps</text>
<text x="549" y="120" font-size="10" fill="#6b7280" text-anchor="middle">(Google Maps et al)</text>
<line x1="420" y1="200" x2="474" y2="200" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<text x="404" y="196" font-size="9.5" fill="#374151">persist Ride</text>
<rect x="474" y="172" width="150" height="56" rx="26" fill="#fff" stroke="#0ea5e9" stroke-width="2.5"/>
<text x="549" y="194" font-size="12" font-weight="700" fill="#0369a1" text-anchor="middle">Primary DB</text>
<text x="549" y="212" font-size="10" fill="#6b7280" text-anchor="middle">(rides · drivers · riders)</text>
<line x1="420" y1="184" x2="334" y2="184" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a2)"/>
<text x="340" y="176" font-size="9.5" fill="#6b7280">return { rideId, fare, eta }</text>
<rect x="24" y="262" width="404" height="112" rx="12" fill="#fef2f2" stroke="#fecaca"/>
<text x="44" y="286" font-size="12.5" font-weight="700" fill="#991b1b">Ride row written NOW (grows as we go)</text>
<text x="44" y="308" font-size="10.5" fill="#374151">id · riderId · fare · eta · source · destination</text>
<text x="44" y="326" font-size="10.5" fill="#374151">status: fare_estimated  ← (later: requested → matched)</text>
<text x="44" y="348" font-size="10" fill="#6b7280">abandoned estimates are fine — they're analytics gold</text>
<text x="44" y="364" font-size="10" fill="#6b7280">("people priced this ride but never booked it")</text>
<rect x="452" y="262" width="404" height="88" rx="12" fill="#fff7ed" stroke="#fdba74"/>
<text x="472" y="286" font-size="12.5" font-weight="700" fill="#c2410c">Rider (foreign key target)</text>
<text x="472" y="308" font-size="10.5" fill="#374151">id · metadata (location · payment …)</text>
<text x="472" y="330" font-size="10" fill="#6b7280">… elision is a tactic: name the FK, don't design the profile</text>
</svg>