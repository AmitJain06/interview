<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="100%" font-family="Segoe UI, system-ui, Arial, sans-serif">
<rect width="880" height="330" rx="14" fill="#fff" stroke="#e5e7eb"/>
<text x="440" y="36" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">High-level design v1 — all-time Top-K (functional, not scalable)</text>
<text x="440" y="60" font-size="13" fill="#6b7280" text-anchor="middle">write path: Kafka → View Consumer → Postgres(videoId, views) · read path: Gateway → Top-K svc → ORDER BY views LIMIT k</text>
<rect x="24" y="80" width="180" height="120" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="114" y="104" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">video_views topic</text>
<text x="114" y="122" font-size="12" fill="#4f46e5" text-anchor="middle">(Kafka, upstream)</text>
<text x="114" y="142" font-size="12" fill="#374151" text-anchor="middle">{videoId, ts}</text>
<text x="114" y="160" font-size="11" fill="#6b7280" text-anchor="middle">partitioned · ~800k/s</text>
<text x="114" y="180" font-size="11" fill="#6b7280" text-anchor="middle">we do NOT own ingest</text>
<rect x="230" y="80" width="180" height="120" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="320" y="104" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">View Consumer</text>
<text x="320" y="124" font-size="11" fill="#374151" text-anchor="middle">INSERT … ON CONFLICT</text>
<text x="320" y="140" font-size="11" fill="#374151" text-anchor="middle">(videoId) DO UPDATE</text>
<text x="320" y="156" font-size="11" fill="#374151" text-anchor="middle">views = views + 1</text>
<text x="320" y="176" font-size="11" fill="#b91c1c" text-anchor="middle">⚠ hot-row contention</text>
<rect x="436" y="80" width="200" height="120" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="536" y="104" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Views DB (Postgres)</text>
<text x="536" y="124" font-size="12" fill="#374151" text-anchor="middle">VideoViews(videoId, views)</text>
<rect x="456" y="134" width="160" height="44" rx="6" fill="#dcfce7" stroke="#22c55e"/>
<text x="536" y="152" font-size="11" fill="#15803d" text-anchor="middle">INDEX on views ✓</text>
<text x="536" y="168" font-size="11" fill="#15803d" text-anchor="middle">sorted list → top-K fast</text>
<rect x="662" y="80" width="194" height="120" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="759" y="104" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">Read path</text>
<text x="759" y="124" font-size="11" fill="#374151" text-anchor="middle">API Gateway → Top-K svc</text>
<rect x="676" y="134" width="166" height="50" rx="6" fill="#1e293b"/>
<text x="759" y="151" font-size="10" fill="#e2e8f0" text-anchor="middle">SELECT videoId, views</text>
<text x="759" y="165" font-size="10" fill="#e2e8f0" text-anchor="middle">ORDER BY views DESC</text>
<text x="759" y="179" font-size="10" fill="#4ade80" text-anchor="middle">LIMIT k;</text>
<line x1="204" y1="140" x2="230" y2="140" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<line x1="410" y1="140" x2="436" y2="140" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<line x1="636" y1="140" x2="662" y2="140" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
<rect x="24" y="214" width="832" height="92" rx="10" fill="#fffbeb" stroke="#fde68a"/>
<text x="40" y="238" font-size="13" font-weight="700" fill="#92400e">Why v1 is “correct but not done” — say this in the interview:</text>
<text x="40" y="258" font-size="12" fill="#78350f">• writes serialize on hot videoIds (counters don’t batch) → will bottleneck at 800k/s.</text>
<text x="40" y="278" font-size="12" fill="#78350f">• only answers ALL-TIME — every view collapsed into one row, history is lost.</text>
<text x="40" y="296" font-size="12" fill="#78350f">• read is fast only because of the views index — but that trick dies the moment we add windows (next diagram).</text>

</svg>
