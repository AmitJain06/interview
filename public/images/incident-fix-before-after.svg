<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="900" height="560" rx="16" fill="#ffffff"/>
  <rect width="900" height="560" rx="16" fill="none" stroke="#e5e7eb" stroke-width="2"/>
  <text x="450" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Containment, Eradication &amp; Recovery — fix the system, not one app</text>
  <text x="450" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Only one flow had the WhatsApp retry flag; there was no feature flag and no fallback, so the fix had to be config — not code</text>

  <text x="16" y="80" font-size="14.5" font-weight="700" fill="#991b1b">BEFORE — why only one app could recover</text>
  <rect x="20" y="92" width="276" height="112" rx="12" fill="#ecfdf5" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="20" y="92" width="276" height="30" rx="12" fill="#22c55e"/>
  <text x="158" y="111" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">DRIVER APP</text>
  <text x="158" y="142" text-anchor="middle" font-size="12.5" fill="#065f46">SMS + retry-via-WhatsApp</text>
  <text x="158" y="164" text-anchor="middle" font-size="12.5" fill="#065f46">flag already wired into this</text>
  <text x="158" y="186" text-anchor="middle" font-size="12.5" fill="#065f46">flow → recovers on retry ✓</text>

  <rect x="312" y="92" width="276" height="112" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="312" y="92" width="276" height="30" rx="12" fill="#ef4444"/>
  <text x="450" y="111" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">BUYER APP</text>
  <text x="450" y="142" text-anchor="middle" font-size="12.5" fill="#7f1d1d">SMS only — no retry fallback,</text>
  <text x="450" y="164" text-anchor="middle" font-size="12.5" fill="#7f1d1d">no feature flag → stuck,</text>
  <text x="450" y="186" text-anchor="middle" font-size="12.5" fill="#7f1d1d">OTP never arrives ✗</text>

  <rect x="604" y="92" width="276" height="112" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="604" y="92" width="276" height="30" rx="12" fill="#ef4444"/>
  <text x="742" y="111" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">VENDOR PORTAL</text>
  <text x="742" y="142" text-anchor="middle" font-size="12.5" fill="#7f1d1d">SMS only — same gaps →</text>
  <text x="742" y="164" text-anchor="middle" font-size="12.5" fill="#7f1d1d">stuck, can’t manage orders</text>
  <text x="742" y="186" text-anchor="middle" font-size="12.5" fill="#7f1d1d">or take payments ✗</text>

  <text x="16" y="238" font-size="14.5" font-weight="700" fill="#065f46">AFTER — the containment fix</text>
  <rect x="20" y="250" width="860" height="96" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <rect x="20" y="250" width="860" height="30" rx="12" fill="#6366f1"/>
  <text x="450" y="269" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">ONE CHANGE BEHIND A FEATURE FLAG — OTP_ROUTING = CONFIG_DRIVEN</text>
  <text x="36" y="300" font-size="12.5" fill="#1e293b">Auth &amp; OTP service now reads configuration: prefer SMS while the DLT is healthy → otherwise fall back to WhatsApp</text>
  <text x="36" y="320" font-size="12.5" fill="#1e293b">Retry is always allowed via WhatsApp · one shared code path · no per-app redeploy</text>
  <text x="36" y="338" font-size="12.5" fill="#64748b">This is the “system change” the interviewer is listening for — not a hotfix in one app.</text>

  <line x1="450" y1="346" x2="450" y2="372" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="20" y="374" width="276" height="64" rx="12" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <text x="158" y="402" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">DRIVER ✓ logs in</text>
  <rect x="312" y="374" width="276" height="64" rx="12" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <text x="450" y="402" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">BUYER ✓ logs in</text>
  <rect x="604" y="374" width="276" height="64" rx="12" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <text x="742" y="402" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">VENDOR ✓ logs in</text>

  <rect x="20" y="462" width="860" height="78" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="36" y="486" fill="#111827" font-weight="700">How it stayed safe: enabled progressively per app, while the login-success rate was watched and an alert was ready.</text>
  <text x="36" y="508" fill="#6b7280">Kept behind the flag → instant toggle and rollback, no emergency deploy. Users recovered within hours, not days.</text>
  <text x="36" y="528" fill="#065f46">Inconsistency is the hidden lesson: a critical path must share one fallback contract — not depend on per-app luck.</text>
</svg>