<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="100%" font-family="Segoe UI, system-ui, Arial, sans-serif">
<defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
<rect width="880" height="350" rx="14" fill="#fff" stroke="#e5e7eb"/>
<text x="440" y="36" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Deep dive 1b — pre-computation: Top-K cron warms the cache</text>
<text x="440" y="60" font-size="13" fill="#6b7280" text-anchor="middle">predictable misses (new hour every hour) → compute BEFORE users ask · NEVER fall through to DB on miss</text>
<rect x="24" y="80" width="200" height="130" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="124" y="104" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">Top-K cron</text>
<text x="124" y="122" font-size="11" fill="#374151" text-anchor="middle">every hour (or 5 min)</text>
<text x="124" y="138" font-size="11" fill="#374151" text-anchor="middle">runs 1 heavy query</text>
<text x="124" y="154" font-size="11" fill="#374151" text-anchor="middle">per window type</text>
<rect x="44" y="162" width="160" height="30" rx="6" fill="#4f46e5"/>
<text x="124" y="181" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">SET week:{ts} → […topK]</text>
<rect x="240" y="80" width="190" height="130" rx="12" fill="#fef9c3" stroke="#fde047"/>
<text x="335" y="104" font-size="13" font-weight="700" fill="#854d0e" text-anchor="middle">Redis (always warm)</text>
<text x="335" y="124" font-size="11" fill="#374151" text-anchor="middle">hit rate ≈ 100%</text>
<text x="335" y="140" font-size="11" fill="#374151" text-anchor="middle">TTL 30 days (month)</text>
<text x="335" y="156" font-size="11" fill="#b91c1c" text-anchor="middle">miss → serve STALE + alert</text>
<text x="335" y="176" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">never query DB live ✗</text>
<rect x="446" y="80" width="180" height="130" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="536" y="104" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">Top-K service</text>
<text x="536" y="124" font-size="11" fill="#374151" text-anchor="middle">reads cache only</text>
<text x="536" y="140" font-size="11" fill="#374151" text-anchor="middle">p99: single-digit ms ✓</text>
<text x="536" y="160" font-size="11" fill="#374151" text-anchor="middle">predictable latency ✓</text>
<text x="536" y="180" font-size="11" fill="#374151" text-anchor="middle">fresh ≤ 1 hour ✓ (NFR)</text>
<rect x="642" y="80" width="214" height="130" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="749" y="104" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Views DB</text>
<text x="749" y="124" font-size="11" fill="#374151" text-anchor="middle">~1 query / hour</text>
<text x="749" y="140" font-size="11" fill="#374151" text-anchor="middle">low, scheduled load</text>
<text x="749" y="160" font-size="11" fill="#374151" text-anchor="middle">still slow per query…</text>
<text x="749" y="180" font-size="11" fill="#374151" text-anchor="middle">…but nobody waits on it</text>
<line x1="224" y1="140" x2="240" y2="140" stroke="#4f46e5" stroke-width="3" marker-end="url(#a3)"/>
<line x1="430" y1="130" x2="446" y2="130" stroke="#22c55e" stroke-width="3" marker-end="url(#a3)"/>
<line x1="224" y1="185" x2="642" y2="185" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a3)"/>
<rect x="24" y="224" width="832" height="102" rx="10" fill="#fffbeb" stroke="#fde68a"/>
<text x="40" y="248" font-size="13" font-weight="700" fill="#92400e">Failure mode — the question your interviewer WILL ask: “what if the cron fails?”</text>
<text x="40" y="268" font-size="12" fill="#78350f">❌ Tempting but wrong: fall through to DB → 1 scheduled QPH becomes thousands of live QPS → DB melts (thundering herd).</text>
<text x="40" y="288" font-size="12" fill="#78350f">✅ Correct: serve slightly-stale cache entry (TTL 30d covers month windows), fire alert, retry cron with backoff.</text>
<text x="40" y="308" font-size="12" fill="#78350f">Freshness NFR (1 min staleness budget) justifies this: users already accept ≤1h-old data; stale-by-2h on rare failure is fine.</text>

</svg>
