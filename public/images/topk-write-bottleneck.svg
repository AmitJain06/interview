<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" font-family="Segoe UI, system-ui, Arial, sans-serif">
<rect width="880" height="340" rx="14" fill="#fff" stroke="#e5e7eb"/>
<text x="440" y="36" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Deep dive 2 — write-side math: Postgres cannot survive 800k/s</text>
<text x="440" y="60" font-size="13" fill="#6b7280" text-anchor="middle">capacity estimation turns “it feels slow” into “here is the proof” — interviewers love this</text>
<rect x="24" y="80" width="270" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="159" y="106" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Demand (video’s numbers)</text>
<text x="44" y="130" font-size="13" fill="#374151">70B views / day ÷ 100k s ≈</text>
<text x="44" y="152" font-size="18" font-weight="700" fill="#b91c1c">700k writes / second</text>
<text x="44" y="174" font-size="12" fill="#374151">peak (evenings, viral events higher)</text>
<text x="44" y="196" font-size="12" fill="#374151">each write = UPDATE one hot row</text>
<text x="44" y="214" font-size="12" fill="#6b7280">+ 100k reads/s? reads are cached ✓</text>
<rect x="308" y="80" width="260" height="150" rx="12" fill="#fef2f2" stroke="#fecaca"/>
<text x="438" y="106" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">One Postgres ceiling</text>
<text x="328" y="130" font-size="13" fill="#374151">~10k writes / second</text>
<text x="328" y="152" font-size="13" fill="#374151">~70 TB comfortable storage</text>
<text x="328" y="174" font-size="14" font-weight="700" fill="#b91c1c">need ≈ 70× the box ✗</text>
<text x="328" y="196" font-size="12" fill="#374151">+ row-level lock on viral videoIds</text>
<text x="328" y="214" font-size="12" fill="#374151">+ index churn on every UPDATE</text>
<rect x="582" y="80" width="274" height="150" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="719" y="106" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">Storage check (same trick)</text>
<text x="602" y="130" font-size="12" fill="#374151">4B videos × (8B id + 8B count)</text>
<text x="602" y="150" font-size="15" font-weight="700" fill="#3730a3">= 64 GB — fits! ✓</text>
<text x="602" y="172" font-size="12" fill="#374151">so storage is FINE,</text>
<text x="602" y="190" font-size="12" fill="#374151">write throughput is the killer.</text>
<text x="602" y="210" font-size="12" fill="#6b7280">→ shard only when math says so</text>
<rect x="24" y="244" width="832" height="72" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="40" y="268" font-size="13" font-weight="700" fill="#3730a3">Say it like this: “70B/day is ~700k writes/s; a tuned Postgres does ~10k/s — I’m ~70× over. Reads are</text>
<text x="40" y="288" font-size="13" font-weight="700" fill="#3730a3">safe behind cache, but every view is a write I can’t cache away — so the write path must change.”</text>
<text x="40" y="308" font-size="12" fill="#4c1d95">This justifies Flink/streaming next: don’t UPDATE per view — buffer, batch, and pre-aggregate the stream.</text>

</svg>
