<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="900" height="430" rx="16" fill="#ffffff"/>
  <rect width="900" height="430" rx="16" fill="none" stroke="#e5e7eb" stroke-width="2"/>
  <text x="450" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Preparation — the OTP login policy, the happy path that defines “working”</text>
  <text x="450" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Any user, any app: buyer, driver or vendor → one login path, two delivery channels, bounded retries</text>

  <rect x="16" y="80" width="185" height="92" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <rect x="16" y="80" width="185" height="30" rx="12" fill="#6366f1"/>
  <text x="108" y="99" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">1 · USER</text>
  <text x="108" y="128" text-anchor="middle" font-size="12.5" fill="#1e293b">Buyer · Driver ·</text>
  <text x="108" y="150" text-anchor="middle" font-size="12.5" fill="#1e293b">Vendor portal — any</text>
  <text x="108" y="164" text-anchor="middle" font-size="9.5" fill="#64748b">of the three apps</text>

  <rect x="245" y="80" width="185" height="92" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <rect x="245" y="80" width="185" height="30" rx="12" fill="#6366f1"/>
  <text x="337" y="99" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">2 · APP</text>
  <text x="337" y="128" text-anchor="middle" font-size="12.5" fill="#1e293b">“Request OTP”</text>
  <text x="337" y="150" text-anchor="middle" font-size="12.5" fill="#1e293b">one login flow shared</text>
  <text x="337" y="164" text-anchor="middle" font-size="9.5" fill="#64748b">by all three apps</text>

  <rect x="474" y="80" width="185" height="92" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <rect x="474" y="80" width="185" height="30" rx="12" fill="#f59e0b"/>
  <text x="566" y="99" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">3 · AUTH &amp; OTP</text>
  <text x="566" y="128" text-anchor="middle" font-size="12.5" fill="#1e293b">6-digit code + session</text>
  <text x="566" y="150" text-anchor="middle" font-size="12.5" fill="#1e293b">link · max 3 retry</text>
  <text x="566" y="164" text-anchor="middle" font-size="9.5" fill="#64748b">attempts</text>

  <rect x="703" y="80" width="181" height="92" rx="12" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
  <rect x="703" y="80" width="181" height="30" rx="12" fill="#f97316"/>
  <text x="793" y="99" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">4 · ROUTER</text>
  <text x="793" y="128" text-anchor="middle" font-size="12.5" fill="#1e293b">config-driven channel</text>
  <text x="793" y="150" text-anchor="middle" font-size="12.5" fill="#1e293b">choice — this is the</text>
  <text x="793" y="164" text-anchor="middle" font-size="9.5" fill="#64748b">fix we shipped later</text>

  <line x1="201" y1="126" x2="245" y2="126" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="126" x2="474" y2="126" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="659" y1="126" x2="703" y2="126" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="16" y="200" width="424" height="110" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <rect x="16" y="200" width="424" height="30" rx="12" fill="#f59e0b"/>
  <text x="228" y="219" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">SMS CHANNEL (primary)</text>
  <text x="228" y="252" text-anchor="middle" font-size="12.5" fill="#1e293b">OTP → SMS gateway → telecom operator →</text>
  <text x="228" y="274" text-anchor="middle" font-size="12.5" fill="#1e293b">DLT registry check (header + template</text>
  <text x="228" y="296" text-anchor="middle" font-size="12.5" fill="#1e293b">must be approved) → delivered to phone</text>

  <rect x="460" y="200" width="424" height="110" rx="12" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <rect x="460" y="200" width="424" height="30" rx="12" fill="#22c55e"/>
  <text x="672" y="219" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">WHATSAPP CHANNEL (fallback)</text>
  <text x="672" y="252" text-anchor="middle" font-size="12.5" fill="#065f46">OTP → WhatsApp provider → delivered,</text>
  <text x="672" y="274" text-anchor="middle" font-size="12.5" fill="#065f46">bypassing DLT — a separate OTT pipe that</text>
  <text x="672" y="296" text-anchor="middle" font-size="12.5" fill="#065f46">is unaffected by SMS blocks like the DLT</text>

  <line x1="793" y1="172" x2="793" y2="186" stroke="#64748b" stroke-width="2"/>
  <line x1="793" y1="186" x2="228" y2="186" stroke="#64748b" stroke-width="2"/>
  <line x1="228" y1="186" x2="228" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="793" y1="186" x2="672" y2="186" stroke="#64748b" stroke-width="2"/>
  <line x1="672" y1="186" x2="672" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="16" y="334" width="868" height="78" rx="12" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <text x="450" y="362" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f46">User enters the 6-digit OTP · up to 3 attempts · verified → ✓ LOGGED IN</text>
  <text x="450" y="386" text-anchor="middle" font-size="12.5" fill="#065f46">All 3 attempts fail → re-request a fresh OTP and start again — never an infinite retry loop</text>
</svg>