<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="100%" font-family="Segoe UI, system-ui, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="880" height="400" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>

  <text x="440" y="40" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Challenge 3 — Consistency: one transaction, two shards</text>
  <text x="440" y="64" font-size="14" fill="#6b7280" text-anchor="middle">a single DB gives atomic transactions; once data spreads across shards that breaks</text>

  <rect x="30" y="96" width="820" height="120" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="50" y="124" font-size="13.5" font-weight="700" fill="#1f2937">Bob on S1 (shard 1) · Alice on S3 (shard 3) — “Bob sends $5 to Alice”</text>

  <rect x="120" y="138" width="120" height="42" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="180" y="158" font-size="12.5" font-weight="700" fill="#3730a3" text-anchor="middle">Bob $10 → $5</text>
  <text x="180" y="174" font-size="11" fill="#6b7280" text-anchor="middle">lives on S1</text>

  <line x1="250" y1="159" x2="500" y2="159" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="430" y="148" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">not one</text>
  <text x="430" y="184" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">atomic step</text>

  <rect x="560" y="138" width="120" height="42" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="620" y="158" font-size="12.5" font-weight="700" fill="#3730a3" text-anchor="middle">Alice $10 → $15</text>
  <text x="620" y="174" font-size="11" fill="#6b7280" text-anchor="middle">lives on S3</text>

  <text x="50" y="206" font-size="12.5" fill="#374151">if “deduct Bob” succeeds but “credit Alice” fails we end up inconsistent — money was lost.</text>

  <text x="270" y="246" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">two textbook answers</text>

  <rect x="30" y="262" width="410" height="130" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="50" y="288" font-size="15" font-weight="700" fill="#92400e">2PC — two-phase commit</text>
  <text x="50" y="314" font-size="12.5" fill="#374151">coordinator: “are you ready?” → all shards</text>
  <text x="50" y="334" font-size="12.5" fill="#374151">reply yes → “commit now” → all commit</text>
  <text x="50" y="360" font-size="12.5" font-weight="600" fill="#b91c1c">slow &amp; fragile — any crash mid-way</text>
  <text x="50" y="378" font-size="12.5" font-weight="600" fill="#b91c1c">leaves locks; production avoids it</text>

  <rect x="460" y="262" width="400" height="130" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="480" y="288" font-size="15" font-weight="700" fill="#3730a3">Saga pattern</text>
  <text x="480" y="314" font-size="12.5" fill="#374151">chain of small steps, each with an</text>
  <text x="480" y="334" font-size="12.5" fill="#374151">undo/compensating action:</text>
  <text x="480" y="360" font-size="12.5" fill="#374151">step 2 fails → auto “refund Bob $5”</text>
  <text x="480" y="378" font-size="12.5" font-weight="600" fill="#15803d">the practical production choice</text>
</svg>