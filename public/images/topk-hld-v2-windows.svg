<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="100%" font-family="Segoe UI, system-ui, Arial, sans-serif">
<rect width="880" height="360" rx="14" fill="#fff" stroke="#e5e7eb"/>
<text x="440" y="36" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">High-level design v2 — add hourly buckets for window queries</text>
<text x="440" y="60" font-size="13" fill="#6b7280" text-anchor="middle">one row per (videoId, hour) — GROUP BY videoId + SUM(views) over [windowStart, windowEnd]</text>
<rect x="24" y="80" width="250" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="149" y="104" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">VideoViews(videoId, views, ts_hour)</text>
<g font-family="ui-monospace, Consolas, monospace" font-size="11" text-anchor="middle">
<rect x="40" y="114" width="218" height="22" rx="4" fill="#1e293b"/><text x="149" y="129" fill="#e2e8f0">vidA | 12 | 10:00</text>
<rect x="40" y="138" width="218" height="22" rx="4" fill="#334155"/><text x="149" y="153" fill="#e2e8f0">vidA | 31 | 11:00</text>
<rect x="40" y="162" width="218" height="22" rx="4" fill="#334155"/><text x="149" y="177" fill="#e2e8f0">vidB |  9 | 10:00</text>
<rect x="40" y="186" width="218" height="22" rx="4" fill="#334155"/><text x="149" y="201" fill="#e2e8f0">vidB | 44 | 11:00</text>
</g>
<text x="149" y="222" font-size="11" fill="#15803d" text-anchor="middle">INDEX on timestamp (not views!)</text>
<rect x="290" y="80" width="270" height="150" rx="12" fill="#1e293b"/>
<text x="425" y="104" font-size="12" font-weight="700" fill="#4ade80" text-anchor="middle">Window query (conceptual SQL)</text>
<text x="310" y="126" font-size="10" fill="#e2e8f0">SELECT videoId, SUM(views) AS views</text>
<text x="310" y="142" font-size="10" fill="#e2e8f0">FROM VideoViews</text>
<text x="310" y="158" font-size="10" fill="#fbbf24">WHERE ts_hour BETWEEN :start AND :end</text>
<text x="310" y="174" font-size="10" fill="#e2e8f0">GROUP BY videoId</text>
<text x="310" y="190" font-size="10" fill="#e2e8f0">ORDER BY SUM(views) DESC LIMIT :k;</text>
<text x="310" y="210" font-size="11" fill="#fca5a5">3 expensive steps: filter → aggregate → sort</text>
<rect x="576" y="80" width="280" height="150" rx="12" fill="#fef2f2" stroke="#fecaca"/>
<text x="716" y="104" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">Why it is dog-slow</text>
<text x="592" y="126" font-size="12" fill="#374151">• must read EVERY row in window</text>
<text x="592" y="146" font-size="12" fill="#374151">• 1 month ≈ 720 hourly buckets</text>
<text x="592" y="166" font-size="12" fill="#374151">• × billions of videos → TBs scanned</text>
<text x="592" y="186" font-size="12" fill="#374151">• aggregation + sort per request</text>
<text x="592" y="206" font-size="12" font-weight="700" fill="#b91c1c">= minutes–hours per query ✗</text>
<rect x="24" y="244" width="832" height="92" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="40" y="268" font-size="13" font-weight="700" fill="#3730a3">Interview line: “this satisfies the FUNCTIONAL requirement (I can answer any window) but violates the</text>
<text x="40" y="288" font-size="13" font-weight="700" fill="#3730a3">read-latency NFR (tens of ms). That gap is exactly what my deep dives will close.”</text>
<text x="40" y="308" font-size="12" fill="#4c1d95">Granularity trade-off: per-hour rows (not per-view, not per-day) — fine enough for hour/day/week/month windows,</text>
<text x="40" y="326" font-size="12" fill="#4c1d95">coarse enough to keep row count manageable. Finer = more rows; coarser = can’t serve small windows.</text>

</svg>
