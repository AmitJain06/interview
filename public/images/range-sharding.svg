<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="100%" font-family="Segoe UI, system-ui, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="880" height="400" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>

  <text x="440" y="40" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Strategy 1 — Range-based sharding</text>
  <text x="440" y="64" font-size="14" fill="#6b7280" text-anchor="middle">split the shard key into clean ranges of IDs — intuitive, but one range ends up taking all the heat</text>

  <rect x="30" y="86" width="610" height="200" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <text x="130" y="108" font-size="13" font-weight="700" fill="#6b7280" text-anchor="middle">S0 · user 0–10M</text>
  <path d="M 60 150 L 60 250 A 70 12 0 0 0 200 250 L 200 150 Z" fill="#eef2f6" stroke="#cbd5e1" stroke-width="1.5"/>
  <ellipse cx="130" cy="150" rx="70" ry="12" fill="#f8fafc"/>
  <text x="130" y="178" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">signups year 1</text>
  <text x="130" y="276" font-size="12" fill="#94a3b8" text-anchor="middle">early days: everything</text>
  <text x="130" y="292" font-size="12" fill="#94a3b8" text-anchor="middle">lives here</text>

  <text x="320" y="108" font-size="13" font-weight="700" fill="#6b7280" text-anchor="middle">S1 · user 10M–20M</text>
  <path d="M 250 150 L 250 250 A 70 12 0 0 0 390 250 L 390 150 Z" fill="#eef2f6" stroke="#cbd5e1" stroke-width="1.5"/>
  <ellipse cx="320" cy="150" rx="70" ry="12" fill="#f8fafc"/>
  <text x="320" y="178" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">signups year 2</text>

  <text x="510" y="108" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">S2 · user 20M–30M · HOT</text>
  <path d="M 440 150 L 440 250 A 70 12 0 0 0 580 250 L 580 150 Z" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <ellipse cx="510" cy="150" rx="70" ry="12" fill="#fef2f2"/>
  <text x="510" y="178" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">all new signups</text>

  <line x1="700" y1="78" x2="530" y2="142" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="720" y="70" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle">new users →</text>
  <text x="720" y="100" font-size="12" fill="#6b7280" text-anchor="middle">monotonic IDs</text>

  <line x1="606" y1="130" x2="770" y2="130" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="768" y="180" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="end">all the traffic</text>

  <rect x="30" y="300" width="820" height="86" rx="14" fill="#fffbfa" stroke="#fecaca" stroke-width="1"/>
  <circle cx="56" cy="326" r="5" fill="#22c55e"/>
  <text x="70" y="331" font-size="13.5" fill="#334155">✓ dead simple to explain and route — “user_id BETWEEN 0 AND 10M goes to S0”</text>
  <circle cx="56" cy="356" r="5" fill="#dc2626"/>
  <text x="70" y="361" font-size="13.5" fill="#334155">✗ monotonic IDs / timestamps fill the newest range → hot shard; early months, the first range holds everything</text>
  <text x="440" y="380" font-size="12.5" fill="#6b7280" text-anchor="middle">works for data that falls into clean, steady ranges — not the production default</text>
</svg>