<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="900" height="440" rx="16" fill="#ffffff"/>
  <rect width="900" height="440" rx="16" fill="none" stroke="#e5e7eb" stroke-width="2"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">How to frame it — S → C → F → I → L  (60–90 seconds)</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#6b7280">One idea per box · own the mistake quickly · spend the most time on the lesson</text>

  <rect x="8" y="80" width="160" height="170" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <rect x="8" y="80" width="160" height="30" rx="12" fill="#6366f1"/>
  <text x="88" y="99" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1 · SITUATION</text>
  <text x="88" y="140" text-anchor="middle" font-size="12.5" fill="#1e293b">Redesigned an offer</text>
  <text x="88" y="162" text-anchor="middle" font-size="12.5" fill="#1e293b">system with a 1.5-</text>
  <text x="88" y="184" text-anchor="middle" font-size="12.5" fill="#1e293b">month deadline</text>

  <rect x="188" y="80" width="160" height="170" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <rect x="188" y="80" width="160" height="30" rx="12" fill="#f59e0b"/>
  <text x="268" y="99" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2 · COMPLEXITY</text>
  <text x="268" y="140" text-anchor="middle" font-size="12.5" fill="#1e293b">Order value · line item ·</text>
  <text x="268" y="162" text-anchor="middle" font-size="12.5" fill="#1e293b">brand · category · item +</text>
  <text x="268" y="184" text-anchor="middle" font-size="12.5" fill="#1e293b">history, wallet, combos</text>

  <rect x="368" y="80" width="160" height="170" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <rect x="368" y="80" width="160" height="30" rx="12" fill="#ef4444"/>
  <text x="448" y="99" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3 · FAILURE</text>
  <text x="448" y="140" text-anchor="middle" font-size="12.5" fill="#1e293b">Underestimated rule</text>
  <text x="448" y="162" text-anchor="middle" font-size="12.5" fill="#1e293b">interactions · committed</text>
  <text x="448" y="184" text-anchor="middle" font-size="12.5" fill="#1e293b">to the timeline too early</text>

  <rect x="548" y="80" width="160" height="170" rx="12" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
  <rect x="548" y="80" width="160" height="30" rx="12" fill="#f97316"/>
  <text x="628" y="99" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4 · IMPACT</text>
  <text x="628" y="140" text-anchor="middle" font-size="12.5" fill="#1e293b">Logic got tangled —</text>
  <text x="628" y="162" text-anchor="middle" font-size="12.5" fill="#1e293b">harder to extend and</text>
  <text x="628" y="184" text-anchor="middle" font-size="12.5" fill="#1e293b">scale near launch</text>

  <rect x="728" y="80" width="160" height="170" rx="12" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <rect x="728" y="80" width="160" height="30" rx="12" fill="#22c55e"/>
  <text x="808" y="99" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">5 · LEARNING</text>
  <text x="808" y="140" text-anchor="middle" font-size="12.5" fill="#065f46">Map dimensions and</text>
  <text x="808" y="162" text-anchor="middle" font-size="12.5" fill="#065f46">interactions first,</text>
  <text x="808" y="184" text-anchor="middle" font-size="12.5" fill="#065f46">design, then validate</text>

  <line x1="168" y1="165" x2="188" y2="165" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="348" y1="165" x2="368" y2="165" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="528" y1="165" x2="548" y2="165" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="708" y1="165" x2="728" y2="165" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="8" y="266" width="884" height="150" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="24" y="292" fill="#111827" font-weight="700">Time budget:   SITUATION 15 s   ·   COMPLEXITY 20 s   ·   FAILURE + IMPACT 25 s   ·   LEARNING 30 s</text>
  <text x="24" y="314" fill="#6b7280">What the interviewer grades:  1) you own the mistake  2) you can explain why it happened  3) you say what changed</text>
  <text x="24" y="336" fill="#6b7280">Stay calm and use a first-person tone — the mistake is a few sentences; the lesson gets the most airtime.</text>
  <rect x="24" y="350" width="848" height="52" rx="8" fill="#ecfdf5" stroke="#22c55e"/>
  <text x="40" y="372" fill="#065f46" font-weight="700">The 3 rules to never break — pick a reasonable mistake · take responsibility · show the learning</text>
  <text x="40" y="392" fill="#065f46">If a rule is broken the frame collapses: it becomes an “excuse” or a “boast”, not a failure-with-learning.</text>
</svg>