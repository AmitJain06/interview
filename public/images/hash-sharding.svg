<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="100%" font-family="Segoe UI, system-ui, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="880" height="400" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>

  <text x="440" y="40" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Strategy 2 — Hash-based sharding: the industry default</text>
  <text x="440" y="64" font-size="14" fill="#6b7280" text-anchor="middle">shard = hash(user_id) mod N — the hash scrambles keys so rows spread evenly</text>

  <rect x="60" y="96" width="120" height="44" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="120" y="121" font-size="12.5" font-weight="700" fill="#3730a3" text-anchor="middle">user_id</text>
  <text x="120" y="136" font-size="11" fill="#6b7280" text-anchor="middle">e.g. 481516</text>

  <line x1="190" y1="118" x2="252" y2="118" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="262" y="104" width="80" height="28" rx="14" fill="#6366f1"/>
  <text x="302" y="123" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">hash()</text>

  <line x1="352" y1="118" x2="414" y2="118" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="424" y="104" width="70" height="28" rx="14" fill="#f59e0b"/>
  <text x="459" y="123" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">mod 3</text>

  <text x="300" y="162" font-size="11.5" fill="#6b7280" text-anchor="middle">hash spreads values evenly</text>

  <line x1="459" y1="132" x2="459" y2="212" stroke="#64748b" stroke-width="2.5"/>
  <line x1="459" y1="180" x2="165" y2="212" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="459" y1="180" x2="565" y2="212" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="459" y1="180" x2="795" y2="212" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <path d="M 70 212 L 70 330 A 95 14 0 0 0 260 330 L 260 212 Z" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <ellipse cx="165" cy="212" rx="95" ry="14" fill="#f0fdf4"/>
  <text x="165" y="252" font-size="16" font-weight="700" fill="#15803d" text-anchor="middle">S0</text>
  <text x="165" y="288" font-size="13" fill="#15803d" text-anchor="middle">~⅓ of users</text>

  <path d="M 470 212 L 470 330 A 95 14 0 0 0 660 330 L 660 212 Z" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <ellipse cx="565" cy="212" rx="95" ry="14" fill="#f0fdf4"/>
  <text x="565" y="252" font-size="16" font-weight="700" fill="#15803d" text-anchor="middle">S1</text>
  <text x="565" y="288" font-size="13" fill="#15803d" text-anchor="middle">~⅓ of users</text>

  <path d="M 700 212 L 700 330 A 75 14 0 0 0 850 330 L 850 212 Z" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <ellipse cx="775" cy="212" rx="75" ry="14" fill="#f0fdf4"/>
  <text x="775" y="252" font-size="16" font-weight="700" fill="#15803d" text-anchor="middle">S2</text>
  <text x="775" y="288" font-size="13" fill="#15803d" text-anchor="middle">~⅓ of users</text>

  <rect x="30" y="352" width="820" height="40" rx="10" fill="#fffbfa" stroke="#fecaca" stroke-width="1"/>
  <text x="50" y="374" font-size="13.5" fill="#374151"><tspan font-weight="700" fill="#b91c1c">Catch — rebalancing:</tspan> add a 4th shard and “mod 3 → mod 4” remaps almost every row → huge reshuffle. <tspan font-weight="700" fill="#15803d">Fix: consistent hashing</tspan> → only ~1/N of keys move.</text>
</svg>