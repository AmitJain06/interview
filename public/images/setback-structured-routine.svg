<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="900" height="440" rx="16" fill="#ffffff"/>
  <rect width="900" height="440" rx="16" fill="none" stroke="#e5e7eb" stroke-width="2"/>
  <text x="450" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Action orientation — a structured routine turns uncertainty into momentum</text>
  <text x="450" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Consistency over motivation: the cadence you can name is the cadence you can defend</text>

  <rect x="20" y="82" width="160" height="112" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <rect x="20" y="82" width="160" height="30" rx="12" fill="#6366f1"/>
  <text x="100" y="101" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">APPLICATIONS</text>
  <text x="100" y="136" text-anchor="middle" font-size="12.5" fill="#1e293b">consistent batch,</text>
  <text x="100" y="158" text-anchor="middle" font-size="12.5" fill="#1e293b">every one tracked</text>

  <rect x="190" y="82" width="160" height="112" rx="12" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <rect x="190" y="82" width="160" height="30" rx="12" fill="#22c55e"/>
  <text x="270" y="101" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">DSA PRACTICE</text>
  <text x="270" y="136" text-anchor="middle" font-size="12.5" fill="#065f46">daily, on a fixed</text>
  <text x="270" y="158" text-anchor="middle" font-size="12.5" fill="#065f46">schedule</text>

  <rect x="360" y="82" width="160" height="112" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <rect x="360" y="82" width="160" height="30" rx="12" fill="#f59e0b"/>
  <text x="440" y="101" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">SYSTEM DESIGN</text>
  <text x="440" y="136" text-anchor="middle" font-size="12.5" fill="#1e293b">2–3 designs a</text>
  <text x="440" y="158" text-anchor="middle" font-size="12.5" fill="#1e293b">week, reviewed</text>

  <rect x="530" y="82" width="160" height="112" rx="12" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
  <rect x="530" y="82" width="160" height="30" rx="12" fill="#f97316"/>
  <text x="610" y="101" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">BACKEND DEPTH</text>
  <text x="610" y="136" text-anchor="middle" font-size="12.5" fill="#1e293b">architecture +</text>
  <text x="610" y="158" text-anchor="middle" font-size="12.5" fill="#1e293b">patterns study</text>

  <rect x="700" y="82" width="180" height="112" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="700" y="82" width="180" height="30" rx="12" fill="#8b5cf6"/>
  <text x="790" y="101" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">INTERVIEW PREP</text>
  <text x="790" y="136" text-anchor="middle" font-size="12.5" fill="#1e293b">mock rounds +</text>
  <text x="790" y="158" text-anchor="middle" font-size="12.5" fill="#1e293b">STAR story bank</text>

  <line x1="450" y1="194" x2="450" y2="222" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="20" y="224" width="860" height="76" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="36" y="248" fill="#111827" font-weight="700">The cadence that keeps you executing:</text>
  <text x="36" y="270" fill="#6b7280">daily practice block  ·  weekly application target  ·  weekly self-review — and the plan is adjusted every Friday based on data.</text>
  <text x="36" y="290" fill="#374151">A routine is what keeps you honest when callbacks are quiet.</text>

  <rect x="20" y="324" width="860" height="92" rx="10" fill="#ecfdf5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="36" y="350" fill="#065f46" font-weight="700">Interview line: “I didn’t wait for motivation — I set a cadence and I tracked it.”</text>
  <text x="36" y="372" fill="#065f46">Tracking turns effort into data; data turns silence into a plan change instead of a mood change.</text>
  <text x="36" y="394" fill="#065f46">This is the “action + persistence” evidence the interviewer is scoring — effort is invisible, the loop is not.</text>
</svg>