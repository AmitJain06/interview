<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="100%" font-family="Segoe UI, system-ui, Arial, sans-serif">
<rect width="880" height="330" rx="14" fill="#fff" stroke="#e5e7eb"/>
<text x="440" y="36" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Core entities — 4 nouns, 2 minutes (don’t over-invest)</text>
<text x="440" y="60" font-size="13" fill="#6b7280" text-anchor="middle">the board: Event · Venue · Performer · Ticket — exactly what GET /event/{id} must return assembled</text>
<rect x="24" y="84" width="250" height="170" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="149" y="110" font-size="14" font-weight="700" fill="#3730a3" text-anchor="middle">Event</text>
<text x="149" y="132" font-size="11" fill="#374151" text-anchor="middle">id · name · description</text>
<text x="149" y="150" font-size="11" fill="#374151" text-anchor="middle">venueId · performerId</text>
<text x="149" y="168" font-size="11" fill="#374151" text-anchor="middle">tickets[]</text>
<text x="149" y="190" font-size="11" fill="#6b7280" text-anchor="middle">the aggregate root the app</text>
<text x="149" y="206" text-anchor="middle" font-size="11" fill="#6b7280">reads + searches</text>
<rect x="24" y="254" width="118" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="83" y="276" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Venue</text>
<text x="83" y="293" font-size="10" fill="#374151" text-anchor="middle">id · location · seatMap</text>
<rect x="156" y="254" width="118" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="215" y="276" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Performer</text>
<text x="215" y="293" font-size="10" fill="#374151" text-anchor="middle">id · …</text>
<rect x="330" y="84" width="250" height="222" rx="12" fill="#fef2f2" stroke="#fecaca"/>
<text x="455" y="110" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">Ticket</text>
<text x="455" y="132" font-size="11" fill="#374151" text-anchor="middle">id · eventId · seat · price</text>
<text x="455" y="150" font-size="11" fill="#374151" text-anchor="middle">userId</text>
<rect x="346" y="164" width="218" height="56" rx="8" fill="#fff" stroke="#fca5a5"/>
<text x="455" y="184" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">status: available | booked</text>
<text x="455" y="202" font-size="10" fill="#6b7280" text-anchor="middle">the field the whole interview orbits</text>
<text x="455" y="244" font-size="11" fill="#991b1b" text-anchor="middle">“available → booked” is the transition</text>
<text x="455" y="262" font-size="11" fill="#991b1b" text-anchor="middle">that must NEVER happen twice</text>
<text x="455" y="290" font-size="10" fill="#6b7280" text-anchor="middle">seatMap (in Venue) renders what’s pickable</text>
<rect x="636" y="84" width="220" height="222" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="746" y="110" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">Relations</text>
<text x="746" y="136" font-size="12" fill="#374151" text-anchor="middle">Venue 1—N Event</text>
<text x="746" y="158" font-size="12" fill="#374151" text-anchor="middle">Performer 1—N Event</text>
<text x="746" y="180" font-size="12" fill="#374151" text-anchor="middle">Event 1—N Ticket</text>
<rect x="652" y="196" width="188" height="94" rx="8" fill="#fff" stroke="#86efac"/>
<text x="746" y="218" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Interview shortcut</text>
<text x="746" y="238" font-size="10.5" fill="#374151" text-anchor="middle">names on the board = your API</text>
<text x="746" y="256" font-size="10.5" fill="#374151" text-anchor="middle">response payloads later;</text>
<text x="746" y="274" font-size="10.5" fill="#374151" text-anchor="middle">keep them consistent</text>
<line x1="274" y1="169" x2="330" y2="169" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<line x1="580" y1="169" x2="636" y2="169" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
</svg>
