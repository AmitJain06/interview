<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="900" height="330" rx="16" fill="#ffffff"/>
  <rect width="900" height="330" rx="16" fill="none" stroke="#e5e7eb" stroke-width="2"/>
  <text x="450" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">The 4 stages I should have separated from day one</text>
  <text x="450" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Keeping these apart is what makes a rule-heavy system extendable — mixing them is what made mine tangled</text>

  <rect x="76" y="78" width="172" height="136" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <rect x="76" y="78" width="172" height="30" rx="12" fill="#6366f1"/>
  <text x="162" y="97" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">1 · DEFINE</text>
  <text x="162" y="138" text-anchor="middle" font-size="12.5" fill="#1e293b">What the offer is —</text>
  <text x="162" y="160" text-anchor="middle" font-size="12.5" fill="#1e293b">rules + configuration,</text>
  <text x="162" y="182" text-anchor="middle" font-size="12.5" fill="#1e293b">independent of the order</text>

  <rect x="268" y="78" width="172" height="136" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <rect x="268" y="78" width="172" height="30" rx="12" fill="#f59e0b"/>
  <text x="354" y="97" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">2 · CHECK ELIGIBILITY</text>
  <text x="354" y="138" text-anchor="middle" font-size="12.5" fill="#1e293b">Is this customer</text>
  <text x="354" y="160" text-anchor="middle" font-size="12.5" fill="#1e293b">qualified? history,</text>
  <text x="354" y="182" text-anchor="middle" font-size="12.5" fill="#1e293b">wallet, activity</text>

  <rect x="460" y="78" width="172" height="136" rx="12" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
  <rect x="460" y="78" width="172" height="30" rx="12" fill="#f97316"/>
  <text x="546" y="97" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">3 · EVALUATE</text>
  <text x="546" y="138" text-anchor="middle" font-size="12.5" fill="#1e293b">Compare the offers —</text>
  <text x="546" y="160" text-anchor="middle" font-size="12.5" fill="#1e293b">combine, or pick the</text>
  <text x="546" y="182" text-anchor="middle" font-size="12.5" fill="#1e293b">best / exclusive winner</text>

  <rect x="652" y="78" width="172" height="136" rx="12" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <rect x="652" y="78" width="172" height="30" rx="12" fill="#22c55e"/>
  <text x="738" y="97" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">4 · APPLY</text>
  <text x="738" y="138" text-anchor="middle" font-size="12.5" fill="#065f46">Execute the benefits</text>
  <text x="738" y="160" text-anchor="middle" font-size="12.5" fill="#065f46">on the order —</text>
  <text x="738" y="182" text-anchor="middle" font-size="12.5" fill="#065f46">discounts, free items</text>

  <line x1="248" y1="146" x2="268" y2="146" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="146" x2="460" y2="146" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="632" y1="146" x2="652" y2="146" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="16" y="240" width="868" height="72" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="32" y="264" fill="#991b1b">Entangled (my first attempt): one function did all four → every new offer re-tested everything and broke my estimates.</text>
  <text x="32" y="286" fill="#065f46">Separated (what I do now): stages are independent and testable → a new rule is a change in one stage, not a rewrite.</text>
</svg>