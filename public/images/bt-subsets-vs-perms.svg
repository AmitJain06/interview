<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" font-family="Segoe UI, system-ui, Arial, sans-serif">
<rect width="880" height="480" rx="14" fill="#fff" stroke="#e5e7eb"/>

<text x="440" y="30" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Subsets (LC 78) vs Permutations (LC 46) — the decision at each node is different</text>
<text x="440" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Subsets: “include OR skip this element?” · Permutations: “which UNUSED element goes next?”</text>

<!-- LEFT: subsets -->
<rect x="24" y="66" width="430" height="334" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="40" y="90" font-size="14" font-weight="800" fill="#15803d">SUBSETS — include or skip → 2ⁿ</text>
<g stroke="#22c55e" stroke-width="1.5">
<line x1="205" y1="136" x2="110" y2="169"/>
<line x1="205" y1="136" x2="300" y2="169"/>
<line x1="110" y1="201" x2="60" y2="236"/>
<line x1="110" y1="201" x2="160" y2="236"/>
<line x1="300" y1="201" x2="260" y2="236"/>
<line x1="300" y1="201" x2="360" y2="236"/>
<line x1="60" y1="268" x2="40" y2="309"/>
<line x1="60" y1="268" x2="95" y2="309"/>
<line x1="160" y1="268" x2="150" y2="309"/>
<line x1="160" y1="268" x2="205" y2="309"/>
<line x1="260" y1="268" x2="260" y2="309"/>
<line x1="260" y1="268" x2="315" y2="309"/>
<line x1="360" y1="268" x2="370" y2="309"/>
<line x1="360" y1="268" x2="418" y2="309"/>
</g>
<g font-size="13" font-weight="700" font-family="Consolas, monospace" fill="#15803d" text-anchor="middle">
<rect x="180" y="100" width="50" height="36" rx="8" fill="#fff" stroke="#22c55e"/><text x="205" y="124">&#123;&#125;</text>
<rect x="85" y="169" width="50" height="36" rx="8" fill="#fff" stroke="#22c55e"/><text x="110" y="193">&#123;&#125;</text>
<rect x="275" y="169" width="50" height="36" rx="8" fill="#fff" stroke="#22c55e"/><text x="300" y="193">&#123;1&#125;</text>
<rect x="35" y="236" width="50" height="36" rx="8" fill="#fff" stroke="#22c55e"/><text x="60" y="260">&#123;&#125;</text>
<rect x="135" y="236" width="50" height="36" rx="8" fill="#fff" stroke="#22c55e"/><text x="160" y="260">&#123;2&#125;</text>
<rect x="235" y="236" width="50" height="36" rx="8" fill="#fff" stroke="#22c55e"/><text x="260" y="260">&#123;1&#125;</text>
<rect x="335" y="236" width="50" height="36" rx="8" fill="#fff" stroke="#22c55e"/><text x="360" y="260">&#123;1,2&#125;</text>
<rect x="15" y="309" width="50" height="36" rx="8" fill="#fff" stroke="#22c55e"/><text x="40" y="333">&#123;&#125;</text>
<rect x="70" y="309" width="50" height="36" rx="8" fill="#fff" stroke="#22c55e"/><text x="95" y="333">&#123;3&#125;</text>
<rect x="125" y="309" width="50" height="36" rx="8" fill="#fff" stroke="#22c55e"/><text x="150" y="333">&#123;2&#125;</text>
<rect x="180" y="309" width="50" height="36" rx="8" fill="#fff" stroke="#22c55e"/><text x="205" y="333">&#123;2,3&#125;</text>
<rect x="235" y="309" width="50" height="36" rx="8" fill="#fff" stroke="#22c55e"/><text x="260" y="333">&#123;1&#125;</text>
<rect x="290" y="309" width="50" height="36" rx="8" fill="#fff" stroke="#22c55e"/><text x="315" y="333">&#123;1,3&#125;</text>
<rect x="345" y="309" width="50" height="36" rx="8" fill="#fff" stroke="#22c55e"/><text x="370" y="333">&#123;1,2&#125;</text>
<rect x="393" y="309" width="50" height="36" rx="8" fill="#fff" stroke="#22c55e"/><text x="418" y="333">&#123;1,2,3&#125;</text>
</g>
<text x="42" y="382" font-size="12" font-weight="700" fill="#15803d">Every node is a valid answer — any length 0…3</text>
<text x="42" y="398" font-size="12" fill="#15803d">8 leaves = 2³ subsets · 2 choices per element (in / out)</text>
<!-- RIGHT: permutations -->
<rect x="470" y="66" width="386" height="334" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="486" y="90" font-size="14" font-weight="800" fill="#3730a3">PERMUTATIONS — choose any UNUSED → n!</text>
<g stroke="#6366f1" stroke-width="1.5">
<line x1="665" y1="137" x2="560" y2="173"/>
<line x1="665" y1="137" x2="770" y2="173"/>
<line x1="560" y1="207" x2="505" y2="248"/>
<line x1="560" y1="207" x2="570" y2="248"/>
<line x1="665" y1="207" x2="635" y2="248"/>
<line x1="665" y1="207" x2="700" y2="248"/>
<line x1="770" y1="207" x2="765" y2="248"/>
<line x1="770" y1="207" x2="830" y2="248"/>
</g>
<g font-size="13" font-weight="700" font-family="Consolas, monospace" fill="#3730a3" text-anchor="middle">
<rect x="637" y="100" width="56" height="36" rx="8" fill="#fff" stroke="#6366f1"/><text x="665" y="124">[]</text>
<rect x="532" y="173" width="56" height="36" rx="8" fill="#fff" stroke="#6366f1"/><text x="560" y="197">[1]</text>
<rect x="637" y="173" width="56" height="36" rx="8" fill="#fff" stroke="#6366f1"/><text x="665" y="197">[2]</text>
<rect x="742" y="173" width="56" height="36" rx="8" fill="#fff" stroke="#6366f1"/><text x="770" y="197">[3]</text>
<rect x="477" y="248" width="56" height="36" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="505" y="272" fill="#15803d">[1,2]</text>
<rect x="542" y="248" width="56" height="36" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="570" y="272" fill="#15803d">[1,3]</text>
<rect x="607" y="248" width="56" height="36" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="635" y="272" fill="#15803d">[2,1]</text>
<rect x="672" y="248" width="56" height="36" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="700" y="272" fill="#15803d">[2,3]</text>
<rect x="737" y="248" width="56" height="36" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="765" y="272" fill="#15803d">[3,1]</text>
<rect x="802" y="248" width="56" height="36" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="830" y="272" fill="#15803d">[3,2]</text>
</g>
<text x="486" y="382" font-size="12" font-weight="700" fill="#3730a3">Every branch adds the LAST unused element → leaf is length 3</text>
<text x="486" y="398" font-size="12" fill="#3730a3">6 leaves = 3! permutations · only full-length states are answers</text>

<rect x="24" y="414" width="832" height="52" rx="10" fill="#fffbeb" stroke="#fde68a"/>
<text x="44" y="436" font-size="13" font-weight="700" fill="#92400e">Remember:  Subsets = include/skip → 2ⁿ (8)   ·   Permutations = any-unused → n! (6)</text>
<text x="44" y="456" font-size="12" fill="#92400e">Same [1,2,3] input, two different decision rules → two very different tree shapes.</text>
</svg>