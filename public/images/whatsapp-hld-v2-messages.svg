<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="100%" font-family="Segoe UI, system-ui, Arial, sans-serif">
<rect width="880" height="520" rx="14" fill="#fff" stroke="#e5e7eb"/>
<text x="440" y="36" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">HLD v2 — satisfying FR2: send + receive messages (improve v1: add the connection map)</text>
<text x="440" y="60" font-size="13" fill="#6b7280" text-anchor="middle">the chat server now holds a hashmap: clientId → live websocket. push to whoever is connected</text>
<rect x="24" y="86" width="420" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="36" y="106" font-size="11" font-weight="700" fill="#0f172a">step 1 · A → send_message(chatId, contents)</text>
<text x="36" y="124" font-size="11" fill="#374151">step 2 · server: chat_participant (PK) → member ids · step 3 · hashmap → live sockets</text>
<rect x="506" y="86" width="350" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="518" y="106" font-size="11" font-weight="700" fill="#0f172a">step 4 · push new_message over each websocket</text>
<text x="518" y="124" font-size="11" fill="#374151">currently-online members receive it live</text>
<rect x="24" y="170" width="110" height="56" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="79" y="196" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">User A app</text>
<text x="79" y="214" font-size="9" fill="#6b7280" text-anchor="middle">sends message</text>
<line x1="134" y1="198" x2="162" y2="198" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<text x="130" y="188" font-size="9" fill="#374151">send_message</text>
<rect x="162" y="150" width="220" height="104" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="272" y="172" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle">Chat server (the one node)</text>
<text x="272" y="192" font-size="10" fill="#374151" text-anchor="middle">lookup participants (PK)</text>
<text x="272" y="212" font-size="10" fill="#374151" text-anchor="middle">hashmap: clientId → socket</text>
<text x="272" y="232" font-size="10" fill="#374151" text-anchor="middle">A · B · C · D connected</text>
<rect x="272" y="142" width="110" height="8" fill="none"/>
<line x1="382" y1="198" x2="410" y2="198" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<text x="388" y="188" font-size="9" fill="#374151">members?</text>
<rect x="410" y="170" width="180" height="56" rx="26" fill="#fff" stroke="#0ea5e9" stroke-width="2.5"/>
<text x="500" y="192" font-size="11.5" font-weight="700" fill="#0369a1" text-anchor="middle">DynamoDB</text>
<text x="500" y="210" font-size="9.5" fill="#6b7280" text-anchor="middle">chat_participant (PK → members)</text>
<line x1="382" y1="224" x2="500" y2="290" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a2)"/>
<line x1="382" y1="224" x2="590" y2="180" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a2)"/>
<line x1="382" y1="224" x2="630" y2="300" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a2)"/>
<rect x="590" y="150" width="110" height="56" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="645" y="176" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">User B app</text>
<text x="645" y="194" font-size="9" fill="#6b7280" text-anchor="middle">(online)</text>
<rect x="500" y="260" width="110" height="56" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="555" y="286" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">User C app</text>
<text x="555" y="304" font-size="9" fill="#6b7280" text-anchor="middle">(online)</text>
<rect x="630" y="300" width="130" height="56" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="695" y="326" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">User D app</text>
<text x="695" y="344" font-size="9" fill="#6b7280" text-anchor="middle">(offline — missed it)</text>
<rect x="24" y="384" width="404" height="112" rx="10" fill="#fef2f2" stroke="#fecaca"/>
<text x="44" y="408" font-size="12.5" font-weight="700" fill="#991b1b">The catch (state it yourself)</text>
<text x="44" y="430" font-size="10.5" fill="#374151">no durability — messages live only in memory and</text>
<text x="44" y="448" font-size="10.5" fill="#374151">require BOTH users to be connected at the same time.</text>
<text x="44" y="466" font-size="10.5" fill="#374151">user D gets NOTHING when they return. This is a</text>
<text x="44" y="484" font-size="10.5" fill="#374151">live chat room, not WhatsApp. → v4 fixes it.</text>
<rect x="452" y="384" width="404" height="112" rx="10" fill="#fffbeb" stroke="#fde68a"/>
<text x="472" y="408" font-size="12.5" font-weight="700" fill="#92400e">Improvement over v1 (one change at a time)</text>
<text x="472" y="430" font-size="10.5" fill="#374151">+ an in-memory hashmap of clientId → websocket.</text>
<text x="472" y="448" font-size="10.5" fill="#374151">No new infrastructure, same single node.</text>
<text x="472" y="466" font-size="10.5" fill="#374151">NFR1 (500 ms) is satisfied FOR ONLINE USERS —</text>
<text x="472" y="484" font-size="10.5" fill="#374151">push is instant. NFR2 (delivery) is not yet.</text>
<defs>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs>
</svg>