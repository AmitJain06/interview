<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="100%" font-family="Segoe UI, system-ui, Arial, sans-serif">
<rect width="880" height="350" rx="14" fill="#fff" stroke="#e5e7eb"/>
<text x="440" y="34" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Deep dive 2b — Flink: aggregate hundreds of GB → sort tens of GB</text>
<text x="440" y="56" font-size="12" fill="#6b7280" text-anchor="middle">hourly tumbling windows over Kafka · example: 1-hour window, K=10k · the two-phase insight that makes cron queries cheap</text>
<rect x="24" y="72" width="270" height="180" rx="12" fill="#fef9c3" stroke="#fde047"/>
<text x="159" y="96" font-size="13" font-weight="700" fill="#854d0e" text-anchor="middle">Phase 1 — AGGREGATE (streaming)</text>
<text x="44" y="116" font-size="11" fill="#374151">per (videoId, hour): buffer views in Flink,</text>
<text x="44" y="132" font-size="11" fill="#374151">emit ONE row per video per hour</text>
<g font-size="10" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">
<rect x="44" y="142" width="230" height="20" rx="4" fill="#1e293b"/><text x="159" y="156" fill="#e2e8f0">vid1: 467+154+375… (billions of keys)</text>
<rect x="44" y="164" width="230" height="20" rx="4" fill="#1e293b"/><text x="159" y="178" fill="#e2e8f0">vid3: 543+684+… = 2,223 total</text>
</g>
<text x="44" y="202" font-size="11" fill="#374151">videos with 0 views in hour → dropped</text>
<text x="44" y="220" font-size="12" font-weight="700" fill="#15803d">100s of GB → 10s of GB ✓</text>
<text x="44" y="238" font-size="11" fill="#6b7280">only “tens of millions” videos active/hr</text>
<rect x="308" y="72" width="270" height="180" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="443" y="96" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">Phase 2 — SORT + TAKE K</text>
<text x="328" y="116" font-size="11" fill="#374151">sort the SMALL table by total desc,</text>
<text x="328" y="132" font-size="11" fill="#374151">keep first K rows only</text>
<g font-size="10" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">
<rect x="328" y="142" width="230" height="20" rx="4" fill="#4f46e5"/><text x="443" y="156" fill="#fff">vid3: 2,223 ★ #1</text>
<rect x="328" y="164" width="230" height="20" rx="4" fill="#334155"/><text x="443" y="178" fill="#e2e8f0">vid9: 1,981 #2 …</text>
</g>
<text x="328" y="202" font-size="11" fill="#374151">K ≤ 1000 → response is kilobytes</text>
<text x="328" y="220" font-size="12" font-weight="700" fill="#3730a3">10s of GB → &lt;10 KB ✓✓</text>
<text x="328" y="238" font-size="11" fill="#6b7280">this tiny result is what cron caches</text>
<rect x="592" y="72" width="264" height="180" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="724" y="96" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">Where it lands</text>
<text x="612" y="116" font-size="11" fill="#374151">• VideoViewsHour table</text>
<text x="612" y="132" font-size="11" fill="#374151">(videoId, views, hour)</text>
<text x="612" y="152" font-size="11" fill="#374151">• index on (timestamp, views)</text>
<text x="612" y="168" font-size="11" fill="#374151">• Day/Month = SUM of 24h /</text>
<text x="612" y="184" font-size="11" fill="#374151">28×24h hourly rows (rollup)</text>
<text x="612" y="204" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">cron reads SMALL tables ✓</text>
<text x="612" y="222" font-size="11" fill="#374151">hourly query = fast now</text>
<rect x="24" y="264" width="832" height="62" rx="10" fill="#fffbeb" stroke="#fde68a"/>
<text x="40" y="286" font-size="12" fill="#78350f">Interview line: “aggregation is the compression — most videos get few views per hour, so grouping collapses hundreds of GB to tens of GB;</text>
<text x="40" y="306" font-size="12" fill="#78350f">sorting that small table down to K≤1000 leaves kilobytes. THAT is the table my cron queries — never the raw stream.”</text>

</svg>
