<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="100%" font-family="Segoe UI, system-ui, Arial, sans-serif">
<rect width="880" height="330" rx="14" fill="#fff" stroke="#e5e7eb"/>
<text x="440" y="36" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Deep dive: surges — virtual waiting queue in front of Booking</text>
<text x="440" y="60" font-size="13" fill="#6b7280" text-anchor="middle">NFR5 · a Taylor Swift onsale = millions of buys in minutes · “first come, first served” beats “everyone at once”</text>
<rect x="24" y="120" width="90" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="69" y="150" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Client</text>
<rect x="140" y="116" width="130" height="60" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="205" y="138" font-size="12" font-weight="700" fill="#3730a3" text-anchor="middle">API Gateway</text>
<text x="205" y="158" font-size="10" fill="#374151" text-anchor="middle">routes buy-traffic</text>
<rect x="296" y="96" width="170" height="100" rx="12" fill="#fff7ed" stroke="#fdba74"/>
<text x="381" y="120" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">Virtual waiting</text>
<text x="381" y="136" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">queue</text>
<text x="381" y="158" font-size="10.5" fill="#374151" text-anchor="middle">assign position</text>
<text x="381" y="174" font-size="10.5" fill="#374151" text-anchor="middle">admit in batches</text>
<line x1="114" y1="146" x2="140" y2="146" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<line x1="270" y1="146" x2="296" y2="146" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<line x1="466" y1="146" x2="520" y2="146" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<rect x="520" y="116" width="130" height="60" rx="10" fill="#fef2f2" stroke="#fecaca"/>
<text x="585" y="138" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">Booking</text>
<text x="585" y="158" font-size="10" fill="#374151" text-anchor="middle">steady trickle, not flood</text>
<rect x="700" y="116" width="156" height="60" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="778" y="138" font-size="11.5" font-weight="700" fill="#15803d" text-anchor="middle">What it protects</text>
<text x="778" y="158" font-size="10" fill="#374151" text-anchor="middle">Postgres + Redis + Stripe</text>
<rect x="24" y="220" width="832" height="86" rx="10" fill="#fffbeb" stroke="#fde68a"/>
<text x="40" y="244" font-size="13" font-weight="700" fill="#92400e">Say it like the video does:</text>
<text x="40" y="266" font-size="12" fill="#78350f">“Without the queue, a popular onsale becomes an outage — every user hammers reserve at once and Postgres collapses.</text>
<text x="40" y="286" font-size="12" fill="#78350f">The queue converts a flash crowd into a metered flow — users wait in line with a position, like real Ticketmaster.”</text>
</svg>
