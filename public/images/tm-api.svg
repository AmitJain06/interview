<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" font-family="Segoe UI, system-ui, Arial, sans-serif">
<rect width="880" height="340" rx="14" fill="#fff" stroke="#e5e7eb"/>
<text x="440" y="36" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">API — 2 reads + the 2-step booking dance</text>
<text x="440" y="60" font-size="13" fill="#6b7280" text-anchor="middle">auth via JWT | sessionToken header · “implement the API and you are done” — it IS the contract</text>
<rect x="24" y="80" width="410" height="118" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="44" y="104" font-size="13" font-weight="700" fill="#15803d">Reads (serve the 100M DAU)</text>
<rect x="44" y="116" width="370" height="30" rx="6" fill="#1e293b"/>
<text x="229" y="135" font-size="10.5" fill="#e2e8f0" text-anchor="middle">GET /event/{eventId} → Event &amp; Venue &amp; Performer &amp; Ticket[]</text>
<rect x="44" y="152" width="370" height="30" rx="6" fill="#1e293b"/>
<text x="229" y="171" font-size="10.5" fill="#e2e8f0" text-anchor="middle">GET /search?term={term}&amp;location={loc}&amp;type={type}&amp;date={date} → Partial&lt;Event&gt;[]</text>
<rect x="446" y="80" width="410" height="118" rx="12" fill="#fef2f2" stroke="#fecaca"/>
<text x="466" y="104" font-size="13" font-weight="700" fill="#991b1b">Writes (the money path — 2 phases, on purpose)</text>
<rect x="466" y="116" width="150" height="30" rx="6" fill="#1e293b"/>
<text x="541" y="135" font-size="10.5" fill="#e2e8f0" text-anchor="middle">POST /booking/reserve</text>
<rect x="626" y="116" width="150" height="30" rx="6" fill="#1e293b"/>
<text x="701" y="135" font-size="10.5" fill="#e2e8f0" text-anchor="middle">PUT /booking/confirm</text>
<text x="466" y="166" font-size="11" fill="#374151">reserve body: { ticketId } · confirm body: { ticketId, paymentDetails(stripe) }</text>
<text x="466" y="186" font-size="11" fill="#991b1b">reserve = HOLD a ticket for a window · confirm = pay + finalize</text>
<rect x="24" y="210" width="832" height="106" rx="10" fill="#fffbeb" stroke="#fde68a"/>
<text x="40" y="234" font-size="13" font-weight="700" fill="#92400e">Why TWO endpoints instead of one “buy” — this is the interview hinge:</text>
<text x="40" y="256" font-size="12" fill="#78350f">payment takes seconds (Stripe round-trip, 3-D Secure, retries) — you cannot hold a DB row lock across it.</text>
<text x="40" y="276" font-size="12" fill="#78350f">reserve takes a SHORT lock (TTL ~10 min) so one user owns the ticket while paying; confirm converts hold → booked.</text>
<text x="40" y="296" font-size="12" fill="#78350f">Abandon the tab? The TTL expires, the hold evaporates, the ticket returns to the pool — no janitor job needed.</text>
</svg>
