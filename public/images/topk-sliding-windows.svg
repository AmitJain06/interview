<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" font-family="Segoe UI, system-ui, Arial, sans-serif">
<rect width="880" height="340" rx="14" fill="#fff" stroke="#e5e7eb"/>
<text x="440" y="36" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Deep dive 3 — sliding windows (only if the interviewer asks)</text>
<text x="440" y="60" font-size="13" fill="#6b7280" text-anchor="middle">“last 60 minutes from NOW” — window start/end move every second · video’s T60→T61 example: +6 new −5 expired = +1</text>
<rect x="24" y="80" width="540" height="140" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="44" y="104" font-size="13" font-weight="700" fill="#0f172a">Minute buckets make sliding computable</text>
<g font-size="10" text-anchor="middle">
<rect x="44" y="114" width="60" height="44" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="74" y="132" fill="#475569">M58</text><text x="74" y="146" fill="#475569">5 views</text>
<rect x="108" y="114" width="60" height="44" rx="6" fill="#fecaca" stroke="#ef4444"/><text x="138" y="132" fill="#7f1d1d">M59✗</text><text x="138" y="146" fill="#7f1d1d">falls out</text>
<rect x="172" y="114" width="60" height="44" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="202" y="132" fill="#475569">M60</text><text x="202" y="146" fill="#475569">…</text>
<rect x="236" y="114" width="60" height="44" rx="6" fill="#dcfce7" stroke="#22c55e"/><text x="266" y="132" fill="#15803d">M61★</text><text x="266" y="146" fill="#15803d">+6 new</text>
</g>
<rect x="44" y="168" width="500" height="34" rx="6" fill="#1e293b"/>
<text x="294" y="189" font-size="11" fill="#e2e8f0" text-anchor="middle">sliding_total(T61) = sliding_total(T60) + views(M61) − views(expired M59)</text>
<text x="44" y="214" font-size="11" fill="#374151">Flink “sliding assigner”: window size (e.g. 60 min) + slide (e.g. 1 min) → each event lands in MULTIPLE overlapping windows</text>
<rect x="578" y="80" width="278" height="140" rx="12" fill="#fef2f2" stroke="#fecaca"/>
<text x="717" y="104" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">Cost vs tumbling</text>
<text x="594" y="126" font-size="11" fill="#374151">• minute tables: 60× more rows than hourly</text>
<text x="594" y="144" font-size="11" fill="#374151">• per-minute recompute per video</text>
<text x="594" y="162" font-size="11" fill="#374151">• tables: Minute + Last{Hour,Day,Month}</text>
<text x="594" y="180" font-size="11" fill="#374151">+ AllTime counters</text>
<text x="594" y="200" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">only pay this if asked ✗ default: no</text>

<rect x="24" y="232" width="832" height="84" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="40" y="256" font-size="12" font-weight="700" fill="#3730a3">How to handle it live: “Tumbling covers hour/day/week/month blocks. True sliding (last-N-minutes from now) needs</text>
<text x="40" y="276" font-size="12" font-weight="700" fill="#3730a3">minute-granularity tables plus add-new/subtract-expired maintenance — I’d add Flink sliding windows +</text>
<text x="40" y="296" font-size="12" font-weight="700" fill="#3730a3">VideoViewsMinute and Last{…} rollups. Should I go deeper there, or stay with tumbling?” (lets interviewer steer)</text>

</svg>
