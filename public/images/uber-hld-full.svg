<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="100%" font-family="Segoe UI, system-ui, Arial, sans-serif">
<rect width="880" height="560" rx="14" fill="#fff" stroke="#e5e7eb"/>
<text x="440" y="36" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">HLD full — FR1 (estimate) + FR2 (request / match) + FR3 (accept / navigate)</text>
<text x="440" y="60" font-size="13" fill="#6b7280" text-anchor="middle">matching is its own service: different compute pattern (async, waiting) → scales and fails independently</text>

<text x="24" y="84" font-size="12" font-weight="700" fill="#0f172a">Rider side</text>
<rect x="24" y="96" width="100" height="56" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="74" y="122" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Rider app</text>
<text x="74" y="140" font-size="9" fill="#6b7280" text-anchor="middle">iOS / Android</text>
<line x1="124" y1="124" x2="152" y2="124" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<rect x="152" y="80" width="150" height="96" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="227" y="102" font-size="12" font-weight="700" fill="#3730a3" text-anchor="middle">API Gateway</text>
<text x="227" y="122" font-size="9.5" fill="#374151" text-anchor="middle">· load balancing</text>
<text x="227" y="138" font-size="9.5" fill="#374151" text-anchor="middle">· routing</text>
<text x="227" y="154" font-size="9.5" fill="#374151" text-anchor="middle">· authn · TLS</text>
<line x1="302" y1="120" x2="330" y2="120" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<rect x="330" y="96" width="130" height="72" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="395" y="118" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">Ride service</text>
<text x="395" y="136" font-size="9.5" fill="#374151" text-anchor="middle">fare + eta</text>
<text x="395" y="152" font-size="9" fill="#6b7280" text-anchor="middle">/accept /update</text>
<line x1="395" y1="96" x2="395" y2="80" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<text x="400" y="72" font-size="9" fill="#374151">ETA (traffic)</text>
<rect x="330" y="36" width="130" height="44" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2.5"/>
<text x="395" y="58" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">3rd-party maps</text>
<text x="395" y="74" font-size="9" fill="#6b7280" text-anchor="middle">(Google Maps …)</text>
<line x1="460" y1="120" x2="600" y2="120" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<text x="500" y="112" font-size="9.5" fill="#374151">persist Ride</text>
<rect x="600" y="88" width="180" height="64" rx="26" fill="#fff" stroke="#0ea5e9" stroke-width="2.5"/>
<text x="690" y="110" font-size="11.5" font-weight="700" fill="#0369a1" text-anchor="middle">Primary DB</text>
<text x="690" y="128" font-size="9.5" fill="#6b7280" text-anchor="middle">rides: status fare_estimated</text>
<text x="690" y="142" font-size="9" fill="#6b7280" text-anchor="middle">→ requested → matched</text>
<line x1="660" y1="152" x2="470" y2="152" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a2)"/>
<text x="500" y="146" font-size="9" fill="#6b7280">return {rideId, fare, eta}</text>

<line x1="227" y1="176" x2="330" y2="250" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a2)"/>
<text x="228" y="222" font-size="9.5" fill="#6b7280">PATCH /ride/{rideId}/request (async)</text>
<text x="24" y="224" font-size="12" font-weight="700" fill="#0f172a">Matching side</text>
<rect x="330" y="250" width="160" height="120" rx="12" fill="#fef2f2" stroke="#fecaca"/>
<text x="410" y="272" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">Ride Matching svc</text>
<text x="346" y="292" font-size="9.5" fill="#374151">1. drivers ≤ N miles ← Location DB</text>
<text x="346" y="310" font-size="9.5" fill="#374151">2. filter status = available</text>
<text x="346" y="328" font-size="9.5" fill="#374151">3. while !match: lock → notify</text>
<text x="346" y="344" font-size="9.5" fill="#374151">   → wait ~10 s → next driver</text>
<line x1="490" y1="268" x2="600" y2="268" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<text x="500" y="260" font-size="9" fill="#374151">get drivers ≤ N miles</text>
<rect x="600" y="238" width="180" height="60" rx="26" fill="#fff" stroke="#10b981" stroke-width="2.5"/>
<text x="690" y="260" font-size="11.5" font-weight="700" fill="#047857" text-anchor="middle">Location DB</text>
<text x="690" y="278" font-size="9.5" fill="#6b7280" text-anchor="middle">(Redis · geohash)</text>
<text x="690" y="292" font-size="9" fill="#047857" text-anchor="middle">current locations only</text>
<line x1="490" y1="330" x2="600" y2="360" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<text x="492" y="352" font-size="9" fill="#374151">status == available?</text>
<rect x="600" y="330" width="180" height="64" rx="26" fill="#fff" stroke="#0ea5e9" stroke-width="2.5"/>
<text x="690" y="352" font-size="11.5" font-weight="700" fill="#0369a1" text-anchor="middle">Primary DB · drivers</text>
<text x="690" y="370" font-size="9.5" fill="#6b7280" text-anchor="middle">status: available | in_ride | offline</text>
<text x="690" y="386" font-size="9" fill="#6b7280" text-anchor="middle">id · car · license plate …</text>
<line x1="410" y1="370" x2="240" y2="376" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<text x="300" y="366" font-size="9" fill="#374151">send 'accept?'</text>
<rect x="166" y="376" width="148" height="56" rx="12" fill="#fff7ed" stroke="#fdba74"/>
<text x="240" y="398" font-size="11.5" font-weight="700" fill="#c2410c" text-anchor="middle">Notification svc</text>
<text x="240" y="416" font-size="9" fill="#6b7280" text-anchor="middle">(push · blackbox — its own</text>
<text x="240" y="428" font-size="9" fill="#6b7280" text-anchor="middle">interview question)</text>
<line x1="200" y1="432" x2="120" y2="466" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<text x="128" y="450" font-size="9" fill="#374151">push notification</text>

<text x="24" y="452" font-size="12" font-weight="700" fill="#0f172a">Driver side</text>
<rect x="20" y="470" width="120" height="56" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="80" y="496" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Driver app</text>
<text x="80" y="514" font-size="9" fill="#6b7280" text-anchor="middle">iOS / Android</text>
<line x1="100" y1="470" x2="227" y2="176" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a2)"/>
<text x="96" y="300" font-size="9" fill="#6b7280">PATCH /ride/{rideId}/accept</text>
<text x="96" y="316" font-size="9" fill="#6b7280">PATCH /ride/{rideId}/update</text>
<line x1="478" y1="498" x2="560" y2="498" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<text x="484" y="490" font-size="9" fill="#374151">PUT /driver/location</text>
<rect x="560" y="470" width="150" height="56" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="635" y="492" font-size="11.5" font-weight="700" fill="#15803d" text-anchor="middle">Location service</text>
<text x="635" y="510" font-size="9" fill="#6b7280" text-anchor="middle">updates every ~5 s</text>
<line x1="710" y1="498" x2="690" y2="300" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a2)"/>
<text x="700" y="430" font-size="9" fill="#6b7280">write (upsert)</text>
<rect x="770" y="420" width="86" height="66" rx="8" fill="#fff" stroke="#d1fadf"/>
<text x="813" y="440" font-size="9" font-weight="700" fill="#047857" text-anchor="middle">driver lock</text>
<text x="813" y="456" font-size="8.5" fill="#6b7280" text-anchor="middle">driverId ·</text>
<text x="813" y="468" font-size="8.5" fill="#6b7280" text-anchor="middle">TTL 5 s</text>
<text x="813" y="480" font-size="8.5" fill="#6b7280" text-anchor="middle">(Redis)</text>
<defs>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs>
</svg>