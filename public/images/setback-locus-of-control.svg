<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Inter, Segoe UI, Arial, sans-serif">
  <rect width="900" height="470" rx="16" fill="#ffffff"/>
  <rect width="900" height="470" rx="16" fill="none" stroke="#e5e7eb" stroke-width="2"/>
  <text x="450" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Ownership — separate what you can’t control from what you can</text>
  <text x="450" y="54" text-anchor="middle" font-size="13" fill="#6b7280">The interviewer listens for exactly this line: “the setback wasn’t mine to control — my response was.”</text>

  <rect x="16" y="82" width="420" height="34" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="226" y="104" text-anchor="middle" font-size="14.5" font-weight="700" fill="#991b1b">CAN’T CONTROL — let it go</text>

  <rect x="16" y="128" width="420" height="40" rx="8" fill="#fff1f2"/>
  <text x="226" y="155" text-anchor="middle" font-size="13" fill="#7f1d1d">The layoff itself</text>
  <rect x="16" y="176" width="420" height="40" rx="8" fill="#fff1f2"/>
  <text x="226" y="203" text-anchor="middle" font-size="13" fill="#7f1d1d">Company decisions &amp; org restructures</text>
  <rect x="16" y="224" width="420" height="40" rx="8" fill="#fff1f2"/>
  <text x="226" y="251" text-anchor="middle" font-size="13" fill="#7f1d1d">Market conditions &amp; hiring cycles</text>
  <rect x="16" y="272" width="420" height="40" rx="8" fill="#fff1f2"/>
  <text x="226" y="299" text-anchor="middle" font-size="13" fill="#7f1d1d">Whether recruiters respond</text>
  <rect x="16" y="320" width="420" height="40" rx="8" fill="#fff1f2"/>
  <text x="226" y="347" text-anchor="middle" font-size="13" fill="#7f1d1d">Timing of callbacks &amp; offers</text>

  <rect x="464" y="82" width="420" height="34" rx="10" fill="#ecfdf5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="674" y="104" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f46">CAN CONTROL — invest here</text>

  <rect x="464" y="128" width="420" height="40" rx="8" fill="#f0fdf4"/>
  <text x="674" y="155" text-anchor="middle" font-size="13" fill="#065f46">A structured daily routine</text>
  <rect x="464" y="176" width="420" height="40" rx="8" fill="#f0fdf4"/>
  <text x="674" y="203" text-anchor="middle" font-size="13" fill="#065f46">The applications I send</text>
  <rect x="464" y="224" width="420" height="40" rx="8" fill="#f0fdf4"/>
  <text x="674" y="251" text-anchor="middle" font-size="13" fill="#065f46">Skill building — DSA, system design, backend</text>
  <rect x="464" y="272" width="420" height="40" rx="8" fill="#f0fdf4"/>
  <text x="674" y="299" text-anchor="middle" font-size="13" fill="#065f46">Tracking + the feedback loop</text>
  <rect x="464" y="320" width="420" height="40" rx="8" fill="#f0fdf4"/>
  <text x="674" y="347" text-anchor="middle" font-size="13" fill="#065f46">Interview readiness &amp; attitude</text>

  <rect x="16" y="384" width="868" height="72" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="32" y="408" fill="#111827" font-weight="700">Golden rule: when something is outside your control, the only move is to over-prepare the things inside it.</text>
  <text x="32" y="430" fill="#6b7280">In the interview: one sentence of acknowledgement for the left column, then all remaining airtime on the right column.</text>
  <text x="32" y="448" fill="#065f46">Emotional control + ownership are heard in that pivot, not in the layoff details.</text>
</svg>