<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" font-family="Segoe UI, system-ui, Arial, sans-serif">
<rect width="880" height="340" rx="14" fill="#fff" stroke="#e5e7eb"/>
<text x="440" y="36" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Optional deep dive — Count-Min Sketch (when precise is too expensive)</text>
<text x="440" y="60" font-size="13" fill="#6b7280" text-anchor="middle">probabilistic counter: d hash rows × w columns · ADD: +1 at every h_i(x) · QUERY: min over rows (never under-counts)</text>
<g font-size="11" text-anchor="middle">
<rect x="24" y="76" width="560" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="40" y="100" font-size="12" font-weight="700" fill="#0f172a">sketch (d=3 rows, w=8 cols — video demo)</text>
<g font-family="ui-monospace, Consolas, monospace" font-size="11">
<rect x="40" y="110" width="528" height="26" rx="4" fill="#eef2ff" stroke="#c7d2fe"/><text x="60" y="127" fill="#3730a3">h1 (xxHash):   [0, 3, 1, 0, 7, 2, 0, 5]</text>
<rect x="40" y="140" width="528" height="26" rx="4" fill="#eef2ff" stroke="#c7d2fe"/><text x="60" y="157" fill="#3730a3">h2 (murmur): [1, 0, 4, 2, 6, 0, 3, 1]</text>
<rect x="40" y="170" width="528" height="26" rx="4" fill="#eef2ff" stroke="#c7d2fe"/><text x="60" y="187" fill="#3730a3">h3 (city):       [2, 1, 0, 5, 1, 4, 0, 2]</text>
</g>
<text x="40" y="214" font-size="11" fill="#374151">ADD “vid9”: increment col h1(vid9), h2(vid9), h3(vid9) · QUERY “vid9”: min(7, 6, 5) = 5 (≥ true count)</text>
</g>
<rect x="598" y="76" width="258" height="150" rx="10" fill="#fef9c3" stroke="#fde047"/>
<text x="727" y="100" font-size="12" font-weight="700" fill="#854d0e" text-anchor="middle">Why / when</text>
<text x="614" y="122" font-size="11" fill="#374151">✓ O(1) memory per key (KBs)</text>
<text x="614" y="140" fill="#374151" font-size="11">✓ handles unbounded cardinality</text>
<text x="614" y="158" font-size="11" fill="#374151">✗ over-counts on collisions</text>
<text x="614" y="176" font-size="11" fill="#374151">✗ never under-counts (one-sided)</text>
<text x="614" y="196" font-size="11" font-weight="700" fill="#854d0e">use only if NFR allows error</text>
<rect x="24" y="238" width="832" height="78" rx="10" fill="#fffbeb" stroke="#fde68a"/>
<text x="40" y="260" font-size="12" font-weight="700" fill="#92400e">Interview positioning (video is explicit): default to PRECISE — most interviewers don’t expect CMS below senior/staff.</text>
<text x="40" y="280" font-size="12" fill="#78350f">Say: “My NFR5 says precise. If you want, I can sketch how CMS + min-heap of size K trades a bounded over-count for</text>
<text x="40" y="300" font-size="12" fill="#78350f">orders-of-magnitude less memory — but I won’t build it unless you ask.” Then move on.</text>

</svg>
