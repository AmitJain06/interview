<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="100%" font-family="Segoe UI, system-ui, Arial, sans-serif">
<rect width="880" height="400" rx="14" fill="#fff" stroke="#e5e7eb"/>
<text x="440" y="36" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">HLD v1 — the full board before deep dives (whiteboard order)</text>
<text x="440" y="60" font-size="13" fill="#6b7280" text-anchor="middle">one API gateway routes to 3 services · every NFR already has a home, drawn on purpose</text>
<rect x="24" y="150" width="90" height="56" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="69" y="182" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Client</text>
<rect x="150" y="130" width="150" height="96" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="225" y="152" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">API Gateway</text>
<text x="225" y="172" font-size="11" fill="#374151" text-anchor="middle">· authentication</text>
<text x="225" y="190" font-size="11" fill="#374151" text-anchor="middle">· rate limiting</text>
<text x="225" y="208" font-size="11" fill="#374151" text-anchor="middle">· routing</text>
<line x1="114" y1="178" x2="150" y2="178" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<rect x="360" y="84" width="130" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="425" y="106" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">Search svc</text>
<text x="425" y="123" font-size="10" fill="#374151" text-anchor="middle">GET /search…</text>
<rect x="550" y="70" width="140" height="76" rx="28" fill="#fff" stroke="#f59e0b" stroke-width="2.5"/>
<text x="620" y="96" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">Elasticsearch</text>
<text x="620" y="114" font-size="10" fill="#6b7280" text-anchor="middle">(AWS OpenSearch)</text>
<text x="620" y="132" font-size="10" fill="#6b7280" text-anchor="middle">node query caching</text>
<rect x="360" y="166" width="130" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="425" y="188" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">Event CRUD</text>
<text x="425" y="205" font-size="10" fill="#374151" text-anchor="middle">GET /event/{id}</text>
<rect x="550" y="160" width="140" height="76" rx="28" fill="#fff" stroke="#0ea5e9" stroke-width="2.5"/>
<text x="620" y="188" font-size="12" font-weight="700" fill="#0369a1" text-anchor="middle">Database</text>
<text x="620" y="206" font-size="10" fill="#6b7280" text-anchor="middle">(Postgres)</text>
<text x="620" y="224" font-size="10" fill="#6b7280" text-anchor="middle">source of truth</text>

<rect x="360" y="252" width="130" height="52" rx="10" fill="#fef2f2" stroke="#fecaca"/>
<text x="425" y="274" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">Booking</text>
<text x="425" y="291" font-size="10" fill="#374151" text-anchor="middle">reserve · confirm</text>
<rect x="560" y="256" width="120" height="52" rx="26" fill="#fff" stroke="#ef4444" stroke-width="2.5"/>
<text x="620" y="278" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Ticket Lock</text>
<text x="620" y="296" font-size="10" fill="#6b7280" text-anchor="middle">(Redis)</text>
<rect x="330" y="330" width="110" height="46" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="385" y="350" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Stripe</text>
<text x="385" y="366" font-size="9.5" fill="#6b7280" text-anchor="middle">paymentDetails</text>
<line x1="300" y1="150" x2="360" y2="115" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<line x1="300" y1="178" x2="360" y2="186" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<line x1="300" y1="206" x2="360" y2="266" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<line x1="490" y1="110" x2="550" y2="108" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<line x1="490" y1="192" x2="550" y2="192" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<line x1="490" y1="286" x2="560" y2="286" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<line x1="620" y1="236" x2="510" y2="258" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a2)"/>
<line x1="440" y1="304" x2="420" y2="330" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>
<line x1="420" y1="330" x2="440" y2="304" stroke="#94a3b8" stroke-width="2" marker-end="url(#a2)"/>
<text x="700" y="200" font-size="11" font-weight="700" fill="#0ea5e9">cdc ↗</text>
<line x1="686" y1="186" x2="662" y2="150" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a3)"/>
<rect x="740" y="300" width="116" height="70" rx="8" fill="#fff" stroke="#fca5a5"/>
<text x="798" y="320" font-size="10" font-weight="700" fill="#b91c1c" text-anchor="middle">{ticketId: userId}</text>
<text x="798" y="336" font-size="10" fill="#6b7280" text-anchor="middle">TTL 10 min</text>
<text x="798" y="352" font-size="9.5" fill="#6b7280" text-anchor="middle">hold = lock</text>
<defs>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
<marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0ea5e9"/></marker>
</defs>
</svg>
