<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" font-family="Segoe UI, system-ui, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="880" height="340" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>

  <text x="440" y="40" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Option A: vertical scaling — a bigger box</text>
  <text x="440" y="64" font-size="14" fill="#6b7280" text-anchor="middle">same architecture, faster hardware — buys time, then hits a ceiling</text>

  <rect x="24" y="86" width="340" height="214" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="44" y="106" width="80" height="24" rx="12" fill="#6366f1"/>
  <text x="84" y="123" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">BEFORE</text>
  <path d="M 120 140 L 120 230 A 75 12 0 0 0 270 230 L 270 140 Z" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <ellipse cx="195" cy="140" rx="75" ry="12" fill="#eef2ff"/>
  <text x="195" y="182" font-size="14" font-weight="700" fill="#3730a3" text-anchor="middle">Postgres box</text>
  <text x="195" y="206" font-size="12" fill="#6b7280" text-anchor="middle">8 vCPU · 32 GB ·  4 TB</text>
  <text x="44" y="272" font-size="13" font-weight="700" fill="#16a34a">✓ handles ~10k writes/s today</text>

  <line x1="376" y1="185" x2="504" y2="185" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="440" y="174" font-size="13" font-weight="700" fill="#6366f1" text-anchor="middle">scale up</text>
  <text x="440" y="212" font-size="12" fill="#6b7280" text-anchor="middle">more RAM · CPU · NVMe</text>

  <rect x="520" y="86" width="340" height="214" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="540" y="106" width="76" height="24" rx="12" fill="#22c55e"/>
  <text x="578" y="123" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">AFTER</text>
  <path d="M 560 126 L 560 246 A 95 16 0 0 0 750 246 L  750 126 Z" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <ellipse cx="655" cy="126" rx="95" ry="16" fill="#f0fdf4"/>
  <text x="655" y="182" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">Bigger Postgres box</text>
  <text x="655" y="208" font-size="12" fill="#6b7280" text-anchor="middle">64 vCPU · 512 GB ·  16 TB</text>
  <text x="540" y="272" font-size="13" font-weight="700" fill="#b45309">⚠ headroom to ~25k writes/s</text>
  <text x="540" y="292" font-size="12" fill="#dc2626">then the wall again — and still one point of failure</text>
</svg>