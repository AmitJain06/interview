@if (onIndexPage) {
  <div class="content-wrapper">
    <header class="page-header">
      <div class="page-icon"><i class="pi pi-code"></i></div>
      <div>
        <h1>Data Structures & Algorithms</h1>
        <p>Master DSA concepts with visual explanations and practical examples.</p>
      </div>
    </header>

    <div class="algorithm-grid">
      @for (algo of algorithms; track algo.route) {
        <a class="algorithm-card" [routerLink]="algo.route">
          <p-card [header]="algo.title">
            <ng-template #content>
              <p>{{ algo.description }}</p>
            </ng-template>
            <ng-template #footer>
              <p-tag [value]="algo.difficulty" [severity]="algo.severity" />
            </ng-template>
          </p-card>
        </a>
      }
    </div>
  </div>
}

<router-outlet />
